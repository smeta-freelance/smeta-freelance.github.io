  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: hex(SALT), iterations: ITER, hash: "SHA-256" }, k, 384));
}
async function dec(bits) {
  var ct = b64(DATA);
  if (String.fromCharCode.apply(null, ct.slice(0, 8)) === "Salted__") ct = ct.slice(16);
  var key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, ct));
}
function show(page) { document.open(); document.write(page); document.close(); }
var saved = null; try { saved = localStorage.getItem("op-key-" + SALT); } catch (e) {}
if (saved) dec(b64(saved)).then(show).catch(function () { try { localStorage.removeItem("op-key-" + SALT); } catch (e) {} });
document.getElementById("f").addEventListener("submit", async function (ev) {
  ev.preventDefault(); var err = document.getElementById("err"); err.textContent = "Проверяю…";
  try {
    var bits = await bitsFrom(document.getElementById("pw").value.trim()); var page = await dec(bits);
    if (document.getElementById("rem").checked) { try { localStorage.setItem("op-key-" + SALT, btoa(String.fromCharCode.apply(null, bits))); } catch (e) {} }
    show(page);
  } catch (e) { err.textContent = "Пароль не подошёл. Проверьте и попробуйте ещё раз."; }
});

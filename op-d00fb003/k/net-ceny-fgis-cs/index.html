*{box-sizing:border-box}

.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--pink));transition:width .4s}
button{font:700 17px var(--f);border:0;border-radius:14px;padding:13px 20px;min-height:48px;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.sec{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);font-weight:600;margin-top:10px}
@media (hover:hover){.opt:hover{border-color:var(--blue)}}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--warn);background:var(--warnbg)}
.fb{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:16px}
.fb.good{background:var(--okbg)} .fb.bad{background:var(--warnbg)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.big{font-size:52px;line-height:1;margin:4px 0}
.note{font-size:13px;color:var(--muted);margin-top:16px}
ul{padding-left:20px;margin:8px 0 0}
.ck{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);font-weight:600;margin-top:10px;padding:12px 14px;font-size:16px;line-height:1.4}
.ck .bx{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:17px;line-height:1}
.ck.on{border-color:var(--ok);background:var(--okbg)}
.ck.on .bx{background:var(--ok);border-color:var(--ok)}
.ck small{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
.gap{margin-top:10px;border-radius:14px;padding:10px 14px;background:var(--warnbg);font-size:16px}
.gap small{display:block;color:var(--muted);font-size:14px}
pre#msg{white-space:pre-wrap;font:15px/1.5 var(--f);background:#F7F8FC;border-radius:12px;padding:10px 12px;margin:8px 0 0}

<script>

function shuf(a) { return a.sort(function () { return Math.random() - .5; }); }   // варианты в случайном порядке
function start() {
  scrollTo(0, 0); k = 0; score = 0; on = {};
  app.innerHTML = '<div class="card"><span class="chip">2 минуты · ' + (quiz ? N + ' вопросов' : N + ' пунктов') + '</span><h1>' + esc(M.title) + '</h1><p>' + esc(M.sub) + '</p>' +

}
function q() {

<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажёры к уроку</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#e3e6ec;--acc:#1f5fd6;--ok:#1e8e4e;--okbg:#e8f6ee;--bad:#c8372d;--badbg:#fdecea}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
header b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
nav{margin-left:auto;display:flex;gap:4px;flex-shrink:0}
nav button{border:0;background:none;padding:8px 12px;border-radius:10px;font:inherit;color:var(--mut);cursor:pointer;min-height:36px;white-space:nowrap}
nav button.on{background:#eaf0fc;color:var(--acc);font-weight:600}nav button .ck{color:var(--ok);font-weight:700}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
h2{font-size:20px;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;color:inherit;cursor:pointer;min-height:44px}
.opt:hover{border-color:var(--acc)}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.src{color:var(--mut);font-size:13px;margin-top:6px}
.main{display:block;margin:16px 0 0 auto;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.main:disabled{opacity:.35;cursor:default}.main.c{margin:16px auto 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:10px 8px;border-bottom:1px solid var(--line)}td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover td{background:#f2f5fb}tr.ok td{background:var(--okbg)}tr.bad td{background:var(--badbg)}
.grid{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin:10px 0 14px}.grid span:nth-child(2n){text-align:right;font-variant-numeric:tabular-nums}
.f{background:#f2f5fb;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0 14px;overflow-wrap:anywhere}
input{font:inherit;font-size:18px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;width:240px;max-width:100%;margin-top:4px}
.done{text-align:center}.big{font-size:40px;font-weight:700;color:var(--acc)}
.tag{display:inline-block;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin-bottom:10px}
@media(max-width:560px){header{padding:0 8px}header b{display:none}nav{margin:0;width:100%;justify-content:space-between}nav button{padding:8px 8px}main{padding:12px}.card{padding:16px}}
</style></head><body>
<header><b id="ttl"></b><nav id="nav"></nav></header>
<main id="m"></main>
<script id="lesson" type="application/json">{"id": "nds-usn", "title": "НДС 22 % и НДС при УСН", "source": "Пособие П. В. Горячкина «НДС и УСН в 2026 году», ред. 07.08.2026", "test": [{"q": "От какой суммы считают НДС в сводном сметном расчёте?", "o": ["От итога глав 1–8", "От итогов глав 1–12 с учётом резерва на непредвиденные работы и затраты", "От итога с резервом, включая операции по ст. 149 НК РФ"], "a": 1, "why": "П. 181 Методики № 421/пр: от итогов глав 1–12 с учётом резерва, кроме работ и услуг по ст. 149 НК РФ.", "p": "с. 3"}, {"q": "Работы выполнены в декабре 2025 года, акт подписан 15 января 2026 года. По какой ставке НДС?", "o": ["20 %", "22 %", "По ставке, указанной в контракте"], "a": 1, "why": "Важна дата подписания акта: приёмка с 01.01.2026 — ставка 22 %, даже если работы выполнялись в 2025 году.", "p": "с. 25"}, {"q": "Подрядчик на УСН применяет ставку НДС 5 %. Может ли он принять «входной» НДС к вычету?", "o": ["Да, как при ставке 22 %", "Нет, «входной» НДС включается в стоимость покупок", "Да, но только по материалам"], "a": 1, "why": "Пп. 8 п. 2 ст. 170 НК РФ: при ставках 5 % и 7 % «входной» НДС вычету не подлежит и включается в стоимость.", "p": "с. 24"}, {"q": "Можно ли считать УСН подрядчика «необлагаемой операцией» по ст. 149 НК РФ и убрать НДС по п. 181 Методики?", "o": ["Да, это одно и то же", "Нет, УСН — специальный налоговый режим (гл. 26.2 НК РФ)"], "a": 1, "why": "УСН — специальный режим; п. 181 Методики № 421/пр и ст. 149 НК РФ к нему не относятся.", "p": "с. 8"}, {"q": "Цена победителя — 108 руб., подрядчик на ставке 5 %. Как посчитать НДС «в том числе»?", "o": ["108 × 5 % = 5,40", "108 × 5/105 = 5,14", "108 × 22/122 = 19,48"], "a": 1, "why": "НДС извлекается из цены по расчётной ставке: 108 × 5/105 = 5,14.", "p": "с. 38"}], "errors": [{"task": "Концовка акта: подрядчик на УСН, ставка НДС 5 %. Нажмите на строку с ошибкой", "rows": [["Итого по позициям", "98,36 руб."], ["НДС 22 %, учтённый в смете", "21,64 руб."], ["Итого", "120,00 руб."], ["Коэффициент снижения", "0,9"], ["ВСЕГО К ОПЛАТЕ с учётом коэффициента снижения", "108,00 руб."], ["в том числе НДС по ставке 5 %", "5,40 руб."]], "bad": [5], "hint": "Проверьте, как посчитан НДС «в том числе».", "why": "НДС «в том числе» извлекают по расчётной ставке: 108 × 5/105 = <b>5,14<\/b>, а не 108 × 5 %. Строка НДС 22 % из сметы остаётся как часть цены контракта.", "p": "с. 38, 42–43"}, {"task": "Концовка акта: подрядчик на УСН освобождён от НДС. Нажмите на строку с ошибкой", "rows": [["Итого по позициям", "98,36 руб."], ["Итого", "98,36 руб."], ["Коэффициент снижения", "0,9"], ["ВСЕГО К ОПЛАТЕ с учётом коэффициента снижения", "88,52 руб."], ["НДС не облагается", "—"]], "bad": [1, 3], "hint": "Сравните порядок строк с концовкой из урока: что идёт сразу после «Итого по позициям»?", "why": "Строку «Сумма НДС, учтённая в смете (22 %)» заказчик не исключает: она остаётся частью цены контракта. Верно: 98,36 + 21,64 = 120,00 × 0,9 = <b>108,00<\/b> к оплате. Во всех случаях сумма к оплате одинаковая.", "p": "с. 42–43"}], "calc": [{"task": "Посчитайте компенсацию НДС при УСН (базисно-индексный метод)", "formula": "((М − Мз) + П × 0,7 + (Эм.бим − Зм) + НР × 0,1712 + СП × 0,15 + ОБп) × 0,22", "fsrc": "Письмо Союза инженеров-сметчиков от 27.01.2026 № РС-ПГ-250/2026", "given": [["М — материалы", 500000], ["Мз — давальческие материалы", 50000], ["П — перевозка", 20000], ["Эм.бим — эксплуатация машин", 80000], ["Зм — оплата труда машинистов", 10000], ["НР — накладные расходы", 60000], ["СП — сметная прибыль", 40000], ["ОБп — оборудование подрядчика", 0]], "answer": 121059.84, "tol": 1, "hint": "Давальческие материалы и оплату труда машинистов вычитают, перевозку берут × 0,7, накладные — с долей 0,1712.", "steps": "(500 000 − 50 000) = 450 000; 20 000 × 0,7 = 14 000; (80 000 − 10 000) = 70 000; 60 000 × 0,1712 = 10 272; 40 000 × 0,15 = 6 000. Сумма 550 272 × 0,22 = 121 059,84.", "p": "с. 21–22", "note": "Цифры учебные; допуск ± 1 руб."}, {"task": "Цена контракта 108 руб., подрядчик на УСН по ставке 7 %. Сколько НДС «в том числе»?", "formula": "Цена × 7/107", "fsrc": "п. 4 ст. 164 НК РФ (расчётная ставка)", "given": [["Цена контракта", 108]], "answer": 7.07, "tol": 0.01, "hint": "НДС не начисляют сверху, а извлекают из цены: умножьте на 7 и разделите на 107.", "steps": "108 × 7 / 107 = 7,065… ≈ 7,07 руб.", "p": "с. 38", "note": "Ответ с копейками, допуск ± 0,01 руб."}]}</script>
<script>
// Тренажёры к уроку Академии Сметного Дела. Данные урока — в JSON выше (собирает build_trener.py).
// Статистика обезличенная: случайный номер сеанса, без имени, почты и телефона. STATS_URL пустой — никуда не отправляется.
const STATS_URL='https://twtxrtgknenldyqmwymy.supabase.co/rest/v1/trener_events', STATS_KEY='sb_publishable_N5Zaxf5mfaMc67JoaCWxVA_fp_fnlLE';
const L=JSON.parse(document.getElementById('lesson').textContent);
const sid=(()=>{try{let s=sessionStorage.getItem('tr_sid');if(!s){s=Math.random().toString(36).slice(2,10);sessionStorage.setItem('tr_sid',s)}return s}catch(e){return Math.random().toString(36).slice(2,10)}})();
window.trLog=[];
function log(kind,item,ok,tries){const e={lesson:L.id,kind,item,ok,tries,sid};trLog.push(e);
 if(STATS_URL.startsWith('http'))try{fetch(STATS_URL,{method:'POST',headers:{apikey:STATS_KEY,Authorization:'Bearer '+STATS_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(e),keepalive:true}).catch(()=>{})}catch(_){}}
const T=[['test','Тест',L.test],['err','Найди ошибку',L.errors],['calc','Расчёт',L.calc]].filter(t=>t[2]&&t[2].length);
const st={};T.forEach(t=>st[t[0]]={i:0,score:0,done:false});
let tab=T[0][0];
document.getElementById('ttl').textContent='Урок «'+L.title+'»';
function nav(){document.getElementById('nav').innerHTML=T.map(t=>`<button data-t="${t[0]}" class="${t[0]==tab?'on':''}">${st[t[0]].done?'<span class="ck">✓</span> ':''}${t[1]}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()})}
const src=p=>`<div class="src">${L.source}, ${p}</div>`;
const items=k=>T.find(t=>t[0]==k)[2];
function head(k,label){const s=st[k],n=items(k).length;return `<div class="top"><span>${label} ${s.i+1} из ${n}</span><span>Верно: ${s.score}</span></div><div class="bar"><i style="width:${s.i/n*100}%"></i></div>`}
function nextTab(){const i=T.findIndex(t=>t[0]==tab),r=T.slice(i+1).concat(T.slice(0,i)).find(t=>!st[t[0]].done);return r}
function finish(k,label){const s=st[k],n=items(k).length;s.done=true;const nx=nextTab();
 m.innerHTML=`<div class="card done"><div class="tag">${label}</div><div class="big">${s.score} из ${n}</div><p>${s.score==n?'Отлично, всё верно.':'Посмотрите ещё раз пояснения к ошибкам.'}</p>${nx?`<button class="main c" id="go">Дальше: ${nx[1]}</button>`:'<p><b>Все тренажёры урока пройдены.</b></p>'}<button class="opt" id="again" style="text-align:center;max-width:260px;margin:12px auto 0">Пройти ещё раз</button></div>`;
 if(nx)document.getElementById('go').onclick=()=>{tab=nx[0];draw()};
 document.getElementById('again').onclick=()=>{st[k]={i:0,score:0,done:false};draw()};nav()}
const m=document.getElementById('m');
function draw(){nav();const s=st[tab];if(s.i>=items(tab).length)return finish(tab,T.find(t=>t[0]==tab)[1]);({test:drawTest,err:drawErr,calc:drawCalc})[tab]()}
function drawTest(){const s=st.test,x=L.test[s.i];let picked=null;const last=s.i==L.test.length-1;
 m.innerHTML=`<div class="card">${head('test','Вопрос')}<h2>${x.q}</h2>${x.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}<div id="fb"></div><button class="main" id="nx" disabled>${last?'Посмотреть результат':'Следующий вопрос'}</button></div>`;
 m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(picked!==null)return;picked=+b.dataset.i;const ok=picked==x.a;if(ok)s.score++;log('test',s.i,ok,1);
  b.classList.add(ok?'ok':'bad');m.querySelectorAll('.opt')[x.a].classList.add('ok');
  fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Верно.':'Не совсем.'}</b> ${x.why}${src(x.p)}</div>`;nx.disabled=false});
 nx.onclick=()=>{s.i++;draw()}}
function drawErr(){const s=st.err,x=L.errors[s.i];let tries=0,solved=false;const last=s.i==L.errors.length-1;
 m.innerHTML=`<div class="card">${head('err','Задача')}<h2>${x.task}</h2><table>${x.rows.map((r,i)=>`<tr class="row" data-i="${i}"><td>${r[0]}</td><td class="n">${r[1]}</td></tr>`).join('')}</table><div id="fb"></div><button class="main" id="nx" disabled>${last?'Посмотреть результат':'Следующая задача'}</button></div>`;
 m.querySelectorAll('tr.row').forEach(t=>t.onclick=()=>{if(solved)return;const i=+t.dataset.i,ok=x.bad.includes(i);tries++;
  m.querySelectorAll('tr.row').forEach(r=>r.classList.remove('bad'));t.classList.add(ok?'ok':'bad');
  if(ok){solved=true;if(tries==1)s.score++;log('err',s.i,tries==1,tries);fb.innerHTML=`<div class="fb ok"><b>Верно.</b> ${x.why}${src(x.p)}</div>`;nx.disabled=false}
  else fb.innerHTML=`<div class="fb bad">Эта строка верна. Подсказка: ${x.hint}</div>`});
 nx.onclick=()=>{s.i++;draw()}}
const fmt=v=>v.toLocaleString('ru-RU',{maximumFractionDigits:2});
function drawCalc(){const s=st.calc,x=L.calc[s.i];let tries=0,solved=false;const last=s.i==L.calc.length-1;
 m.innerHTML=`<div class="card">${head('calc','Задача')}<h2>${x.task}</h2><div class="f">${x.formula}<div class="src">${x.fsrc}${x.p?' — '+L.source+', '+x.p:''}</div></div>
 <div class="grid">${x.given.map(g=>`<span>${g[0]}</span><span>${fmt(g[1])}</span>`).join('')}</div>
 <label>Ответ, руб.<br><input id="v" inputmode="decimal" autocomplete="off" placeholder="Введите число"></label><div id="fb"></div><button class="main" id="ck">Проверить</button><div class="src">${x.note||''}</div></div>`;
 const v=document.getElementById('v');v.onkeydown=e=>{if(e.key=='Enter')ck.click()};
 ck.onclick=()=>{if(solved){s.i++;return draw()}const n=parseFloat(v.value.replace(/[\s ]/g,'').replace(',','.'));if(isNaN(n)){fb.innerHTML='<div class="fb bad">Введите число.</div>';return}
  tries++;const ok=Math.abs(n-x.answer)<=x.tol;
  if(ok){solved=true;if(tries==1)s.score++;log('calc',s.i,tries==1,tries);fb.innerHTML=`<div class="fb ok"><b>Верно: ${fmt(x.answer)} руб.</b><br>${x.steps}</div>`;ck.textContent=last?'Посмотреть результат':'Следующая задача'}
  else if(tries<2)fb.innerHTML=`<div class="fb bad">Пока не сходится. Подсказка: ${x.hint}</div>`;
  else{solved=true;log('calc',s.i,false,tries);fb.innerHTML=`<div class="fb bad"><b>Разбор:</b> ${x.steps}</div>`;ck.textContent=last?'Посмотреть результат':'Следующая задача'}}}
draw();
</script></body></html>

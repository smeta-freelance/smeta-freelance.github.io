      try { localStorage.setItem("sf-key-" + SALT, btoa(String.fromCharCode.apply(null, bits))); localStorage.setItem("sf-ts-" + SALT, Date.now()); } catch (e) {}
    }
    show(page);
  } catch (e) { err.textContent = "Неверный пароль. Попробуйте ещё раз."; }
});

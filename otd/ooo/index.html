<title>Окна отдела обучения</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2333;--mut:#667085;--line:#e3e6ee;--acc:#2f6fed;--acc2:#1f56c4;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 4px 18px rgba(20,30,60,.06)}
.logo{width:100%;max-width:240px;display:block;margin:0 auto 14px}
h1{font-size:24px;margin:0 0 6px;text-align:center}h1 span{color:var(--acc)}
.sub{color:var(--mut);text-align:center;margin:0 0 20px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--acc);border-color:transparent}
button.main{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 16px inherit;font-family:inherit;cursor:pointer}
button.main:hover{background:var(--acc2)}button.main:disabled{opacity:.6;cursor:wait}
.err{color:var(--red);min-height:22px;margin-top:10px;text-align:center;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 2px 10px rgba(20,30,60,.05);transition:.15s}
.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile b{display:block;font-size:19px;margin-bottom:4px}.tile small{color:var(--mut);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.out{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;text-decoration:underline}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
[hidden]{display:none!important}
</style></head><body>

var $=function(i){return document.getElementById(i)};
function show(id){["load","login","hub"].forEach(function(x){$(x).hidden=x!==id})}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({apikey:KEY,"Content-Type":"application/json"},opt.headers||{});return fetch(SB+path,opt)}
function setRt(rt){try{if(rt)localStorage.setItem("ooo_rt",rt);else localStorage.removeItem("ooo_rt")}catch(e){}}
function getRt(){try{return localStorage.getItem("ooo_rt")}catch(e){return null}}
async function token(grant,body){var r=await api("/auth/v1/token?grant_type="+grant,{method:"POST",body:JSON.stringify(body)});if(!r.ok)return null;return r.json()}
async function loadStaff(){var r=await api("/rest/v1/otd_staff?select=me,name,role,ck&limit=1",{headers:{Authorization:"Bearer "+sess.access_token}});if(!r.ok)return null;var a=await r.json();return a[0]||null}
function toLogin(msg){sess=null;staff=null;show("login");$("err").textContent=msg||"";$("go").disabled=false}
async function afterAuth(){
  staff=await loadStaff();
  if(!staff){setRt(null);toLogin("Этого адреса нет в списке отдела обучения. Напишите Руслану.");return}
  var nx=(new URLSearchParams(location.search)).get("next");
  if(nx&&/^\/[^\/\\]/.test(nx)){location.replace(nx);return}
  var h=(location.hash||"").slice(1);
  if(h){openCrm(h)}else{$("nm").textContent=NM[staff.me]||"коллега";show("hub")}
}
function openCrm(tab){
  var bytes=Uint8Array.from(atob(TPL),function(c){return c.charCodeAt(0)});
  var html=new TextDecoder("utf-8").decode(bytes);
  var o={me:staff.me,sb:{url:SB,key:KEY},tok:sess.access_token,rt:sess.refresh_token,ver:"20.11.2026 19:17"};
  if(staff.ck)o.ck=staff.ck;
  html=html.replace("<head>","<head><script>window.OTD="+JSON.stringify(o).replace(/</g,"\\u003c")+";<\/script>");
  try{history.replaceState(null,"","#"+tab)}catch(e){}
  document.open();document.write(html);document.close();
}
$("login").addEventListener("submit",async function(e){
  e.preventDefault();$("err").textContent="";$("go").disabled=true;
  var j=await token("password",{email:$("em").value.trim(),password:$("pw").value});
  if(!j||!j.access_token){toLogin("Неверная почта или пароль.");return}
  sess=j;setRt(j.refresh_token);afterAuth();
});
$("out").addEventListener("click",function(){setRt(null);sess=null;staff=null;try{history.replaceState(null,"",location.pathname)}catch(e){}$("pw").value="";show("login")});
Array.prototype.forEach.call(document.querySelectorAll(".tile"),function(b){b.addEventListener("click",function(){openCrm(b.getAttribute("data-tab"))})});
(async function(){
  var rt=getRt();
  if(rt){var j=await token("refresh_token",{refresh_token:rt});if(j&&j.access_token){sess=j;setRt(j.refresh_token);afterAuth();return}setRt(null)}
  toLogin("");
})();
})();

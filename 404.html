<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена · Академия Сметного Дела</title>
<style>
:root{--bg:#fff;--ink:#15171C;--muted:#5B6270;--line:#E6E8EC;--btn:#141413;--btn-ink:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 18px/1.5 Onest,"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:12vh 16px 48px;text-align:center}
.mark{font-size:15px;color:var(--muted);letter-spacing:.02em;margin:0 0 28px}
h1{font-size:26px;line-height:1.25;margin:0 0 12px;font-weight:650}
p{margin:0 0 14px;color:var(--ink)}p.s{color:var(--muted);font-size:17px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 28px;margin:14px 0 6px;border-radius:16px;background:var(--btn);color:var(--btn-ink);font-size:18px;font-weight:600;text-decoration:none}
a.btn:focus-visible{outline:3px solid #8AA2F5;outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="mark">Академия Сметного Дела</p>
  <h1>Этой страницы здесь нет</h1>
  <p>Возможно, ссылка набрана не полностью. Или работа только что создана — новая страница открывается через несколько минут.</p>
  <a class="btn" href="/pe/">Открыть мои работы</a>
  <p class="s">Если страница так и не открылась, напишите мне в разделе «Мои работы» — я помогу.</p>
</main>
<script>/* 10.11 (Руслан: без плашки «Страница открывается»): страница работы /pe/… только что создана — ждём публикацию здесь и открываем сами */
(function(){if(!/^\/pe\/[^\/]+\//.test(location.pathname))return;var h=document.querySelector('h1'),p=h&&h.nextElementSibling;
if(h)h.textContent='Страница готовится';if(p)p.textContent='Работа только что создана. Страница откроется здесь сама примерно через 2–5 минут — её можно не закрывать.';
var n=0,t=setInterval(function(){if(++n>60){clearInterval(t);return}fetch(location.pathname+'?nc='+Date.now(),{cache:'no-store'}).then(function(r){if(r.ok){clearInterval(t);location.replace(location.pathname+'?r='+Date.now()+location.hash)}}).catch(function(){})},15000)})();</script>
</body>
</html>

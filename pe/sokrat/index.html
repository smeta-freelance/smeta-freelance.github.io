button{font:inherit;cursor:pointer}a{color:var(--blue)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;font-size:15px;position:sticky;top:0;height:100vh;overflow:auto}
.rail .logo{display:block;margin:0 4px 14px}.rail .logo img{height:30px;display:block}
.rail .new{display:block;background:var(--blue);color:#fff;border-radius:10px;padding:9px 12px;font-weight:600;text-align:center;margin-bottom:14px;text-decoration:none}
.rail .app-nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin:0 4px 2px}.rail .app-nm img{width:26px;height:26px}
.rail .hint{color:var(--muted);font-size:13px;margin:0 4px 10px}
.rail .back{display:block;color:var(--blue);margin:14px 4px 0;font-size:14px;text-decoration:none}
.rail .w{display:block;padding:8px 10px;border-radius:10px;margin-bottom:4px;color:var(--ink);text-decoration:none;line-height:1.35}
.rail .w:hover{background:#fff}.rail .w.on{background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.12)}
.rail .w small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.rail .empty{color:var(--muted);font-size:14px;margin:6px 4px}
main{display:flex;flex-direction:column;min-width:0}
.top{height:56px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);font-size:15px;white-space:nowrap;position:sticky;top:0;background:#fff;z-index:5}
.top b.nm{font-size:16px;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:30vw}
.steps{display:flex;gap:6px;align-items:center;color:var(--muted)}.steps i{font-style:normal}
.steps .now{color:var(--blue);font-weight:600;border:1.5px solid var(--blue);border-radius:20px;padding:2px 10px}.steps .ok{color:var(--green)}
.top .pc{margin-left:auto;color:var(--muted)}.top .pc b{color:var(--blue)}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 10px;font-size:18px}
.chat{flex:1;max-width:820px;width:100%;margin:0 auto;padding:18px 22px 170px}
.me{display:flex;justify-content:flex-end;margin:16px 0}.me .b{background:var(--blue-soft);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:75%;white-space:pre-wrap}
.files{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}.files span{font-size:14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 8px;white-space:normal}
.so{display:flex;gap:12px;margin:16px 0}.ava{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;object-fit:contain;padding:3px}
.txt{flex:1;min-width:0}.txt h2{font-size:22px;margin:4px 0 6px;line-height:1.3}.txt h4{font-size:18px;margin:16px 0 2px}
.txt p{margin:6px 0}.txt ol,.txt ul{margin:4px 0;padding-left:24px}.txt li{margin:2px 0}
.txt .lbl{color:var(--muted);font-weight:600}.txt h4.upd::after{content:"обновлено";margin-left:8px;font-size:13px;font-weight:600;color:var(--green);background:#E8F5EE;border-radius:6px;padding:1px 6px;vertical-align:2px}
.txt[contenteditable=true]{outline:2px solid var(--blue);outline-offset:6px;border-radius:6px}
.txt.err{color:var(--red)}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}
.acts{display:flex;gap:16px;margin-top:8px;font-size:14px;color:var(--muted);flex-wrap:wrap;align-items:center}
.acts button{border:0;background:none;color:var(--muted);padding:2px 0;font-size:14px}.acts button:hover{color:var(--ink)}
.acts .hl{background:var(--mark);color:var(--ink);border-radius:8px;padding:2px 10px;font-weight:600}
.acts .sv{background:var(--blue);color:#fff;border-radius:8px;padding:4px 14px;font-weight:600}.acts .sv:hover{color:#fff}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick button{border:1.5px solid var(--blue);color:var(--blue);background:#fff;border-radius:20px;padding:5px 14px;font-size:16px;font-weight:600}
.quick button.main{background:var(--blue);color:#fff}
.legend{background:#FFFBEA;border:1px solid #F3E3A0;border-radius:12px;padding:10px 14px;font-size:16px;margin:2px 0 8px}
.legend .hlx{display:inline-block;background:var(--mark);border-radius:8px;padding:0 8px;font-weight:600}
.caret{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-2px;animation:b 1s steps(1) infinite;margin-left:2px}@keyframes b{50%{opacity:0}}
.wait{color:var(--muted)}.wait b{color:var(--ink)}
.done-note{background:#E8F5EE;border:1px solid #BFE3CC;border-radius:12px;padding:10px 14px}
.dock{position:fixed;left:220px;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 22px;z-index:6}
.dock .in{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
.field{flex:1;display:flex;align-items:flex-end;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px;background:#fff}
.field:focus-within{border-color:var(--blue)}
.field textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:17px;line-height:1.45;max-height:180px;padding:6px 0;background:none;color:var(--ink)}
.ib{border:0;background:none;width:40px;height:40px;border-radius:10px;font-size:19px;color:var(--muted)}.ib:hover{background:var(--side)}.ib.rec{color:var(--red);background:#FDECEE}
.ib.send{background:var(--blue);color:#fff}.ib.send:disabled{background:#C9D3F5}
.go{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:0 22px;height:52px;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.go:disabled{background:#C9D3F5;cursor:default}
.go2{background:#fff;color:var(--blue);border:1.5px solid var(--blue);border-radius:12px;padding:0 16px;height:52px;font-weight:600;white-space:nowrap}
.menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(16,24,40,.16);padding:6px;z-index:20;min-width:300px;display:none}
.menu.on{display:block}.menu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 12px;font-size:16px}
.menu button:hover{background:var(--side)}.menu small{display:block;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#15171C;color:#fff;border-radius:10px;padding:8px 16px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.login{max-width:420px;margin:12vh auto;padding:28px;border:1px solid var(--line);border-radius:16px}
.login h1{font-size:22px;margin:10px 0 4px;display:flex;gap:10px;align-items:center}.login h1 img{width:34px}
.login p{color:var(--muted);margin:0 0 16px;font-size:16px}
.login input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;margin-bottom:10px}
.login .go{width:100%;justify-content:center}.login .msg{color:var(--red);font-size:15px;min-height:22px;margin-top:8px}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{position:fixed;left:-240px;width:220px;z-index:40;transition:left .2s;box-shadow:0 0 30px rgba(0,0,0,.15)}
  .rail.open{left:0}.burger{display:inline-block}.dock{left:0}.steps{display:none}.top b.nm{max-width:none}}
.fb{position:absolute;z-index:25;display:none;background:var(--mark);color:var(--ink);border:1px solid #E8C94A;border-radius:10px;padding:6px 14px;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(16,24,40,.18);white-space:nowrap}
.fb.on{display:block}.fb:hover{background:#FFE070}
.legend .hlx{cursor:pointer}
/* dev39: История урока, прежние ответы, ожидание новой работы */

.hbtn+.pc{margin-left:0}
.hist{position:fixed;top:0;right:-460px;width:440px;max-width:100vw;height:100vh;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(16,24,40,.12);z-index:45;transition:right .2s;display:flex;flex-direction:column}
.hist.on{right:0}.hist .hh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}.hist .hh b{font-size:17px}
.hist .hx{margin-left:auto;border:0;background:none;font-size:22px;color:var(--muted);width:36px;height:36px;border-radius:8px}.hist .hx:hover{background:var(--side)}
.hist .ht{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}.hist .ht button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:2px 11px;font-size:14px}
.hist .ht button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.hist .hs{margin:10px 16px 4px;height:38px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px}
.hist .hb{flex:1;overflow:auto;padding:4px 16px 20px}.hist .hd{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 4px}

.hist .hi{display:block;width:100%;text-align:left;border:0;border-left:3px solid #C7D2FE;background:none;padding:5px 9px;margin:3px 0;font-size:15px;line-height:1.4;border-radius:0 8px 8px 0}
.hist .hi:hover{background:var(--side)}.hist .hi b{font-weight:600}.hist .hi .tm{color:var(--muted);font-size:13px;margin-left:4px}
.hist .hi .full{display:none;white-space:pre-wrap;margin-top:6px}.hist .hi.open .short{display:none}.hist .hi.open .full{display:block}
.hist .hi .ins{display:none;margin-top:8px;border:1.5px solid var(--blue);color:var(--blue);background:#fff;border-radius:8px;padding:3px 12px;font-size:14px;font-weight:600}.hist .hi.open .ins{display:inline-block}
.hist .none{color:var(--muted);font-size:15px;margin-top:16px}
.prev{border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:14px 0;background:#FAFBFF}
.prev p.lead{margin:0 0 6px}.prev .qa{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:16px}
.prev .qa .qh{font-weight:600;font-size:15px}.prev .qa .qh small{font-weight:400;color:var(--muted);margin-left:6px}
.prev .qa .qv{margin:4px 0;white-space:pre-wrap}.prev .qa .qb{display:flex;gap:8px}
.prev .qa .qb button{border:1.5px solid var(--blue);color:var(--blue);background:#fff;border-radius:14px;padding:1px 11px;font-size:14px;font-weight:600}
.prev .qa .qb button.ok{background:var(--blue);color:#fff}.prev .qa.done{border-color:#BFE3CC;background:#F3FBF6}.prev .qa.done .qb{display:none}
.prev .qa.done .qh::after{content:" · ✓ верно";color:var(--green);font-weight:600}
.prev .more{border:0;background:none;color:var(--blue);font-size:14px;padding:6px 0 0}
.newwait{max-width:560px;margin:14vh auto;text-align:center}.newwait img{width:56px}.newwait h2{font-size:22px;margin:10px 0 6px}
.newwait .bar{height:8px;border-radius:6px;background:var(--side);overflow:hidden;margin:16px 0 8px}.newwait .bar i{display:block;height:100%;background:var(--blue);width:3%;transition:width .8s}
.newwait p{color:var(--muted);margin:4px 0}
.top{overflow:hidden}.steps{min-width:0;overflow:hidden;flex-shrink:1}   /* тест rel46: без горизонтальной прокрутки на 1000–1024 px */
@media (max-width:1280px){.hbtn{font-size:0;padding:4px 8px;flex:none}.hbtn::before{content:"🕘";font-size:18px}.top .pc{display:none}}

function md(t,upd){var L=String(t||'').replace(/<!--.*?-->/g,'').split('\n'),o=[],lt=null;

    close();o.push('<p>'+inl(l)+'</p>')});close();return o.join('')}
/* обратно: правка руками и жёлтое — в тот же текст */

      if(tg==='MARK'){var x=run(c);s+=x.trim()?'=='+x+'==':x}else if(tg==='B'||tg==='STRONG'){s+='**'+run(c)+'**'}
      else if(tg==='SPAN'&&c.classList.contains('lbl')){s+='**'+run(c)+'**'}else if(tg==='A'){s+='['+run(c)+']('+c.getAttribute('href')+')'}

    o.push('<div class="hi" role="button" tabindex="0" data-hi="'+i+'"><b>'+esc(lbl)+'</b> — <span class="short">«'+esc(x.a.length>110?x.a.slice(0,110)+'…':x.a)+'»</span><span class="tm">'+hm(x.at)+'</span>'+
      (x.qn?'<div class="full" style="color:var(--muted);font-size:14px">'+esc(shortQ(x.q))+'</div>':'')+'<div class="full">'+esc(x.a)+'</div><button type="button" class="ins" data-ins="'+i+'">Вставить в ответ</button></div>')});
  b.innerHTML=o.join('');
  b.querySelectorAll('[data-hi]').forEach(function(e){e.onclick=function(ev){if(ev.target.closest('[data-ins]'))return;e.classList.toggle('open')};e.onkeydown=function(ev){if(ev.key==='Enter')e.classList.toggle('open')}});
  b.querySelectorAll('[data-ins]').forEach(function(e){e.onclick=function(){var x=it[+e.getAttribute('data-ins')],t=$('#tx');if(!t||!x)return;
    t.value=(t.value?t.value.replace(/\s*$/,'\n'):'')+x.a;t.oninput&&t.oninput();histShow(false);t.focus();toast('Вставил в поле ответа — поправьте и отправьте Сократу',3000)}})}
/* dev39: новая работа из кабинета — сайт обновляется 1–3 минуты; спрашиваем свежую страницу и открываем работу, как только она появится */
function waitNew(id){   /* rel48 (Руслан 11.11: «ни на каком этапе не ждать»): новая работа открывается сразу — ответ Сократа идёт из базы,

  var D={deck:id,title:'Ваша новая работа',tok:null,st:'Сократ читает материалы',url:'/pe/'+id+'/',pending:true};ME.decks=[D].concat((ME.decks||[]).filter(function(d){return d.deck!==id}));
  var t0=Date.now(),busy=false,tm=setInterval(async function(){if(busy)return;if(Date.now()-t0>20*60e3){clearInterval(tm);return}busy=true;
    try{var r=await fetch(location.pathname+'?nc='+Date.now(),{cache:'no-store'}),h=await r.text(),m=h.match(/,ACC=(\{[\s\S]*?\}),SB=window\.SF_SB/);
      if(m){var A=JSON.parse(m[1]),ah=ls('pe-hub-acc'),kb=ls('pe-hub-k');if(A[ah]&&kb){var M=await dec(b64(kb),A[ah].data),x=(M.decks||[]).filter(function(d){return d.deck===id})[0];
        if(x){clearInterval(tm);ACC=A;D.tok=x.tok;D.url=x.url||D.url;D.title=x.title||D.title;delete D.pending;ME.decks=[D].concat((M.decks||[]).filter(function(d){return d.deck!==id}));works();head();if(PENDQ&&CUR===D){var tx=$('#tx');if(tx&&!tx.value.trim())tx.value=PENDQ;PENDQ='';var go=function(){if(WAIT){setTimeout(go,1500);return}sendText()};go()}}}}}catch(e){}
    busy=false},10000);
  return app()}
function vtr(){try{return localStorage.getItem('sf-voter')||''}catch(e){return ''}}
function waitLine(){var s0=Math.round((Date.now()-WAIT.t0)/1000);if(CUR&&CUR.pending&&!WAIT.text&&s0>150&&!(ST&&ST.intro))return '<p class="wait"><b>Не нахожу материалы этой работы.</b> Откройте её, пожалуйста, из <a href="/pe/">«Мои работы»</a> — или начните новую работу.</p>';   /* rel51: неверный адрес — без бесконечного ожидания */

  var eta=m==='program'?'обычно 20–40 секунд':m==='slides'?'обычно 1–2 минуты':'обычно до минуты';
  return '<p class="wait"><b>'+what+'…</b> '+(s>90&&!WAIT.text?'Ещё немного — заканчиваю. ':'')+'· '+s+' с · '+eta+'<span class="caret"></span></p>'}
function renderWait(){var e=$('#wtx');if(!e)return;e.innerHTML=WAIT.text?((/###\s*Слайд/.test(WAIT.text)?LEGEND:'')+md(WAIT.text)+'<span class="caret"></span>'):waitLine();
  var nearBottom=window.innerHeight+window.scrollY>document.body.scrollHeight-260;if(nearBottom)scrollEnd()}

function head(){if(!CUR)return;$('#nm').textContent=(ST&&ST.title)||CUR.title;var hp=!!(ST&&ST.doc&&ST.doc.program),hs=hasSlides(),hd=!!(ST&&ST.handed);
  var s=[['Материалы',1],['Программа урока',hs||hd?1:0],['Слайды',hd?1:0],['Передать Малевичу',hd?1:0]],now=hd?-1:hs?2:1;
  $('#steps').innerHTML=s.map(function(x,i){return '<i class="'+(x[1]?'ok':i===now?'now':'')+'">'+(x[1]?'✓ ':i===now?'● ':'○ ')+x[0]+'</i>'}).join('—');
  $('#pc').innerHTML=hd?'Передано Малевичу':'У Сократа · шаг <b>'+(now+1)+' из 4</b>';

function bind(){document.querySelectorAll('.so [data-a]').forEach(function(b){var so=b.closest('.so'),id=so.getAttribute('data-id'),a=b.getAttribute('data-a');
    if(a==='hl')b.onmousedown=function(e){e.preventDefault();yellow(so,id)};else b.onclick=function(e){
      if(a==='cp'){var m=msg(id);navigator.clipboard.writeText(plain(m&&m.text)).then(function(){toast('Скопировано')},function(){toast('Не получилось скопировать — выделите текст и нажмите Cmd+C')})}
      else if(a==='ed')editMsg(so,id);else if(a==='dl')openDl(b)}});

    if(q==='yes')ask('slides','Да, пишем слайды');else if(q==='short')ask('program','Короче, на 10 минут');else{var t=$('#tx');t.value='Добавьте пункт: ';t.focus();t.oninput()}}})}
function msg(id){return ((ST&&ST.msgs)||[]).filter(function(m){return m.id===id&&m.who==='so'})[0]}
function saveMsg(id,text){var m=msg(id);if(!m||!text)return;m.text=text;m.upd=null;LOCAL=Date.now();

function yellow(so,id){var s=getSelection(),tx=$('.txt',so);if(!s.rangeCount||s.isCollapsed||!tx.contains(s.anchorNode)){toast('Выделите слова мышкой, потом нажмите «🖍 Выделить смысл»',3200);return}

  ac.querySelector('[data-a2=hl]').onmousedown=function(e){e.preventDefault();yellow(so,id)};
  ac.querySelector('[data-a2=ok]').onclick=function(){var t=back(tx);EDIT=null;tx.contentEditable='false';saveMsg(id,t);render()};
  ac.querySelector('[data-a2=no]').onclick=function(){EDIT=null;render()}}

function sendText(){var t=$('#tx'),v=t.value.trim();if(!v||WAIT)return;if(CUR&&CUR.pending&&!vtr()){PENDQ=v;toast('Сохранил. Отправлю Сократу сам, как только работа подключится — обычно 1–3 минуты.',5000);return}   /* rel48b: ответ не теряется */if(ST&&ST.handed){toast('Тексты уже у Малевича. Правки — в его приложении.',3500);return}
  t.value='';t.oninput();var mode=hasSlides()?'edit':'program';if(!hasSlides()&&ST&&ST.doc&&ST.doc.program&&/^\s*да[\s,.!]*(пишем|пиши|давай|верно)?/i.test(v))mode='slides';ask(mode,v)}

  job('sokrat_handoff').then(function(ok){if(!ok){b.disabled=false;b.textContent='Передать Малевичу →';toast('Нет связи — попробуйте ещё раз',4000);return}
    var n=0,tm=setInterval(function(){G2L.get(CUR.deck,'sok',3000).then(function(r){n++;if(r&&r.data&&r.data.handed){clearInterval(tm);ST=r.data;render();toast('✓ Передано Малевичу',3000)}else if(n>40){clearInterval(tm);b.disabled=false;b.textContent='Передать Малевичу →';toast('Задерживаюсь — я сообщил Руслану. Тексты сохранены.',5000)}})},1500)})}

/* ---------- голос: распознавание речи браузера (если есть) ---------- */

  b.onclick=function(){if(REC){REC.stop();return}var r=new R();r.lang='ru-RU';r.interimResults=true;r.continuous=true;var t=$('#tx'),base=t.value?t.value+' ':'';

document.querySelectorAll('#dl button').forEach(function(b){b.onclick=function(){$('#dl').classList.remove('on');var f=b.getAttribute('data-f');if(!ST||!ST.doc||!ST.doc.program){toast('Пока нечего скачивать');return}

  if(f==='md')save(new Blob([ST.ai_md||''],{type:'text/markdown;charset=utf-8'}),nm+' — для нейросети.md');else save(docx(),nm+' — тексты слайдов.docx')}});
function save(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);toast('Скачиваю: '+name)}
function xe(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function runs(s,base){var out=[],re=/(\*\*.+?\*\*|==.+?==|\[[^\]]+\]\(https?:[^)]+\))/g,i=0,m;s=String(s).replace(/<!--.*?-->/g,'');

  while(m=re.exec(s)){r(s.slice(i,m.index));var x=m[0];if(x[0]==='*')r(x.slice(2,-2),{b:1,c:/:$/.test(x.slice(2,-2))?'5B6270':''});else if(x[0]==='=')r(x.slice(2,-2),{hl:1});else{var mm=x.match(/\[([^\]]+)\]\(([^)]+)\)/);r(mm[1]+' ('+mm[2]+')',{c:'1745E0'})}i=m.index+x.length}
  r(s.slice(i));return out.join('')}
function para(s,o){o=o||{};return '<w:p><w:pPr><w:spacing w:before="'+(o.bf||0)+'" w:after="'+(o.af==null?80:o.af)+'"/>'+(o.ind?'<w:ind w:left="360" w:hanging="240"/>':'')+'</w:pPr>'+runs(s,o)+'</w:p>'}
function mdDocx(t){var o=[];String(t||'').split('\n').forEach(function(l){var m;if(!l.trim())return;
  if(m=l.match(/^##\s+(.*)/))o.push(para(m[1],{b:1,sz:30,bf:200,af:120}));else if(m=l.match(/^###\s+(.*)/))o.push(para(m[1],{b:1,sz:26,bf:240,af:80}));
  else if(m=l.match(/^\s*[-•]\s+(.*)/))o.push(para('•  '+m[1],{ind:1}));else if(m=l.match(/^\s*(\d+)[.)]\s+(.*)/))o.push(para(m[1]+'.  '+m[2],{ind:1}));else o.push(para(l))});return o.join('')}
function docx(){var d=ST.doc||{},t=ST.title||CUR.title||'Урок';
  var body=para(t,{b:1,sz:36,af:60})+para('Академия Сметного Дела · тексты слайдов от Сократа (методист)',{c:1,af:240})+
    para('Жёлтым — ключевые слова: Малевич выделит их на слайде, Гудвин покажет крупно при монтаже.',{af:240})+
    para('Программа урока',{b:1,sz:30,bf:120})+mdDocx(String(d.program||'').replace(/^##\s+/m,'### '))+(d.slides?para('Слайды',{b:1,sz:30,bf:360})+mdDocx(d.slides):'');
  var doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>';
  return zip([['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
    ['word/document.xml',doc]])}
var CRC=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){var enc=new TextEncoder(),parts=[],cd=[],off=0;
  function u16(v){return [v&255,(v>>>8)&255]}function u32(v){return [v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]}

    var lh=[].concat([0x50,0x4b,3,4],u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(c),u32(da.length),u32(da.length),u16(nm.length),u16(0));

    cd.push(new Uint8Array([].concat([0x50,0x4b,1,2],u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(c),u32(da.length),u32(da.length),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off))),nm);
    off+=lh.length+nm.length+da.length});
  var cds=cd.reduce(function(s,x){return s+x.length},0);
  return new Blob(parts.concat(cd,[new Uint8Array([].concat([0x50,0x4b,5,6],u16(0),u16(0),u16(files.length),u16(files.length),u32(cds),u32(off),u16(0)))]),{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}

/* 11.11 (Руслан: «выделить смысл»): кнопка жёлтого — прямо над выделенными словами */
function selSo(){var s=getSelection();if(!s.rangeCount||s.isCollapsed)return null;var n=s.anchorNode;n=n&&(n.nodeType===1?n:n.parentNode);
  var tx=n&&n.closest&&n.closest('.so .txt');if(!tx||!tx.contains(s.focusNode))return null;var so=tx.closest('.so'),m=msg(so.getAttribute('data-id'));
  if(!m||(m.kind!=='slides'&&m.kind!=='edit'))return null;if(n.closest('.legend'))return null;return so}
function fbPlace(){var b=$('#fb');if(!b)return;var so=selSo();if(!so){b.classList.remove('on');return}
  var s=getSelection(),r=s.getRangeAt(0).getBoundingClientRect(),c=s.getRangeAt(0).commonAncestorContainer;c=c.nodeType===1?c:c.parentNode;
  b.textContent=c.closest('mark')?'Снять выделение':'🖍 Выделить смысл';b.classList.add('on');
  var x=Math.max(8,Math.min(innerWidth-b.offsetWidth-8,r.left+r.width/2-b.offsetWidth/2)),y=r.top+scrollY-b.offsetHeight-10;if(r.top<70)y=r.bottom+scrollY+10;
  b.style.left=x+'px';b.style.top=y+'px';b._so=so}
document.addEventListener('mouseup',function(){setTimeout(fbPlace,10)});document.addEventListener('keyup',function(e){if(e.shiftKey||e.key==='Shift')fbPlace()});
document.addEventListener('selectionchange',function(){var s=getSelection();if(!s.rangeCount||s.isCollapsed){var b=$('#fb');if(b)b.classList.remove('on')}});
window.addEventListener('scroll',function(){var b=$('#fb');if(b&&b.classList.contains('on'))fbPlace()},{passive:true});
$('#fb').addEventListener('mousedown',function(e){e.preventDefault();var so=this._so;this.classList.remove('on');if(so)yellow(so,so.getAttribute('data-id'))});
document.addEventListener('mousedown',function(e){var h=e.target.closest&&e.target.closest('.legend .hlx');if(!h)return;e.preventDefault();var so=selSo();
  if(so)yellow(so,so.getAttribute('data-id'));else toast('Сначала выделите слова мышкой в тексте слайда — рядом появится жёлтая кнопка',3600)});

boot();

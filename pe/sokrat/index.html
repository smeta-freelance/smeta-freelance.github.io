async function sha(s){var d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(d)).map(function(x){return('0'+x.toString(16)).slice(-2)}).join('')}

/* ---------- разметка: ответ Сократа обычным текстом ---------- */
function inl(s){s=esc(s);
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,function(_,t,u){return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>'});
  s=s.replace(/^\*\*([^*]+?):\*\*/,'<span class="lbl">$1:</span>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');return s}
function md(t,upd){var L=String(t||'').replace(/<!--.*?-->/g,'').split('\n'),o=[],lt=null;
  function close(){if(lt){o.push('</'+lt+'>');lt=null}}
  L.forEach(function(l){var m;
    if(/^\s*$/.test(l)){close();return}
    if(m=l.match(/^##\s+(.*)/)){close();o.push('<h2>'+inl(m[1])+'</h2>');return}
    if(m=l.match(/^###\s+(.*)/)){close();var n=(m[1].match(/Слайд\s*(\d+)/)||[])[1];o.push('<h4'+(upd&&n&&upd.indexOf(+n)>=0?' class="upd"':'')+'>'+inl(m[1])+'</h4>');return}
    if(m=l.match(/^\s*[-•]\s+(.*)/)){if(lt!=='ul'){close();o.push('<ul>');lt='ul'}o.push('<li>'+inl(m[1])+'</li>');return}
    if(m=l.match(/^\s*(\d+)[.)]\s+(.*)/)){if(lt!=='ol'){close();o.push('<ol start="'+(+m[1]||1)+'">');lt='ol'}o.push('<li>'+inl(m[2])+'</li>');return}   /* 11.11: нумерация не сбивается после абзаца */
    close();o.push('<p>'+inl(l)+'</p>')});close();return o.join('')}
/* обратно: правка руками и жёлтое — в тот же текст */
function back(el){var o=[];
  function run(n){var s='';n.childNodes.forEach(function(c){if(c.nodeType===3){s+=c.nodeValue;return}if(c.nodeType!==1)return;var tg=c.tagName;if(tg==='DETAILS'||(c.classList&&(c.classList.contains('legend')||c.classList.contains('srch'))))return;   /* 17.11: журнал поиска и подсказка — не часть ответа */
      if(tg==='MARK'){var x=run(c);s+=x.trim()?'=='+x+'==':x}else if(tg==='B'||tg==='STRONG'){s+='**'+run(c)+'**'}

function xe(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var CRC=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  function u16(v){return [v&255,(v>>>8)&255]}function u32(v){return [v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]}

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function hex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function b2s(b){return btoa(String.fromCharCode.apply(null,b))}
function lat(s){return String(s||'').trim().toLowerCase().split('').map(function(c){var k=RU.indexOf(c);return k>=0?EN[k]:c}).join('')}
function npw(s){return String(s||'').toLowerCase().split('').map(function(c){var k=RU.indexOf(c);return k>=0?EN[k]:c}).join('').replace(/[\s–—-]+/g,'').toUpperCase()}
async function sha(s){var d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(d)).map(function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
async function bits(pw,salt){var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:hex(salt),iterations:ITER,hash:'SHA-256'},k,384))}
async function dec(b,data){var ct=b64(data);if(String.fromCharCode.apply(null,ct.slice(0,8))==='Salted__')ct=ct.slice(16);
  var key=await crypto.subtle.importKey('raw',b.slice(0,32),'AES-CBC',false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:b.slice(32,48)},key,ct)))}

async function boot(){
  var kb=ls('pe-hub-k'),ah=ls('pe-hub-acc'),exp=+ls('pe-hub-exp')||0;

function noflag(){$('#root').innerHTML='<div class="login"><h1><img src="img/sokrat.png" alt="">Сократ · методист</h1><p>Сократ в чате пока включён не у всех. Ваши работы — в кабинете.</p><a class="go" href="/pe/#works">Открыть мои работы →</a></div>'}

  $('#lf').onsubmit=async function(e){e.preventDefault();var L=$('#lg').value,P=$('#pw').value,m=$('#lm');m.textContent='';
    var ah=await sha('acc:'+String(L).trim().toLowerCase());if(!ACC[ah])ah=await sha('acc:'+lat(L));
    if(!ACC[ah]){m.textContent='Такого логина у Сократа нет. Проверьте логин или откройте кабинет.';return}
    try{var b=await bits(npw(P),ACC[ah].salt);ME=await dec(b,ACC[ah].data)}catch(x){m.textContent='Пароль не подошёл. Проверьте раскладку и попробуйте ещё раз.';return}

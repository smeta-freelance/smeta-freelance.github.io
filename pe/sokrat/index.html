  var key=await crypto.subtle.importKey('raw',b.slice(0,32),'AES-CBC',false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:b.slice(32,48)},key,ct)))}

function saveMsg(id,text){var m=msg(id);if(!m||!text)return;m.text=text;m.upd=null;LOCAL=Date.now();
  if(m===lastOf('slides'))ST.doc.slides=text.split(/(?=^###\s*Слайд)/m).slice(1).join('').trim();
  job('sokrat_save',{id:id,text:text}).then(function(ok){toast(ok?'Сохранено':'Нет связи — правка не сохранилась, попробуйте ещё раз',ok?1600:4000)})}
function yellow(so,id){var s=getSelection(),tx=$('.txt',so);if(!s.rangeCount||s.isCollapsed||!tx.contains(s.anchorNode)){toast('Выделите слова мышкой, потом нажмите «🖍 Выделить смысл»',3200);return}
  var r=s.getRangeAt(0),n=r.commonAncestorContainer;n=n.nodeType===1?n:n.parentNode;var mk=n.closest('mark');
  if(mk&&tx.contains(mk)){mk.replaceWith(document.createTextNode(mk.textContent))}
  else{var k=document.createElement('mark');try{r.surroundContents(k)}catch(e){toast('Выделите слова внутри одной строки');return}}
  s.removeAllRanges();if(EDIT===id)return;saveMsg(id,back(tx))}
function editMsg(so,id){var tx=$('.txt',so),ac=$('.acts',so);if(EDIT&&EDIT!==id){toast('Сначала сохраните другую правку');return}
  EDIT=id;tx.contentEditable='true';tx.focus();var keep=ac.innerHTML;
  ac.innerHTML='<button class="sv" data-a2="ok">Сохранить</button><button data-a2="no">Отмена</button><span>Правьте текст прямо здесь</span>';
  var hb2=ac.querySelector('[data-a2=hl]');if(hb2)hb2.onmousedown=function(e){e.preventDefault();yellow(so,id)};   /* v1.2: кнопки может не быть — не падаем */
  ac.querySelector('[data-a2=ok]').onclick=function(){var t=back(tx);EDIT=null;tx.contentEditable='false';saveMsg(id,t);render()};
  ac.querySelector('[data-a2=no]').onclick=function(){EDIT=null;render()}}

function sendText(){var t=$('#tx'),v=t.value.trim();if(!v||WAIT)return;if(CUR&&CUR.pending&&!vtr()){PENDQ=v;toast('Сохранил. Отправлю Сократу сам, как только работа подключится — обычно 1–3 минуты.',5000);return}   /* rel48b: ответ не теряется */if(ST&&ST.handed){toast('Тексты уже у Малевича. Правки — в его приложении.',3500);return}
  t.value='';t.oninput();var mode=hasSlides()?'edit':'program';if(!hasSlides()&&ST&&ST.doc&&ST.doc.program&&/^\s*да[\s,.!]*(пишем|пиши|давай|верно)?/i.test(v))mode='slides';ask(mode,v)}
function handoff(){if(!hasSlides()||WAIT)return;var b=$('#hand');b.disabled=true;b.textContent='Передаю…';
  var c=$('#chat'),hc=document.createElement('div');hc.className='so';hc.id='hcard';hc.innerHTML='<img class="ava" src="img/sokrat.png" alt="Сократ"><div class="col" style="flex:1"><div class="done-note" style="background:#EEF2FE;border-color:#C9D5FB"><b>Передаю тексты слайдов Малевичу…</b><div style="height:8px;border-radius:6px;background:#fff;margin:8px 0;overflow:hidden"><i id="hbar" style="display:block;height:100%;width:10%;background:#1745E0;transition:width .8s"></i></div><span style="color:#5B6270;font-size:15px">Собираю тексты, ключевые слова и источники в один пакет</span></div></div>';c.appendChild(hc);scrollEnd();
  var hp=10,ht=setInterval(function(){var x=$('#hbar');if(!x){clearInterval(ht);return}hp=Math.min(92,hp+8);x.style.width=hp+'%'},700);
  job('sokrat_handoff').then(function(ok){if(!ok){b.disabled=false;b.textContent='Передать Малевичу →';toast('Нет связи — попробуйте ещё раз',4000);return}
    var n=0,tm=setInterval(function(){G2L.get(CUR.deck,'sok',3000).then(function(r){n++;if(r&&r.data&&r.data.handed){clearInterval(tm);clearInterval(ht);ST=r.data;maKeep();render();scrollEnd()}else if(n>40){clearInterval(tm);b.disabled=false;b.textContent='Передать Малевичу →';toast('Задерживаюсь — я сообщил Руслану. Тексты сохранены.',5000)}})},1500)})}

/* ---------- голос: распознавание речи браузера (если есть) ---------- */
function mic(){var R=window.SpeechRecognition||window.webkitSpeechRecognition,b=$('#mic');if(!R){b.style.display='none';return}
  b.onclick=function(){if(REC){REC.stop();return}var r=new R();r.lang='ru-RU';r.interimResults=true;r.continuous=true;var t=$('#tx'),base=t.value?t.value+' ':'';
    r.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;t.value=base+s;t.oninput()};
    r.onend=function(){REC=null;b.classList.remove('rec');b.textContent='🎤'};r.onerror=function(){toast('Микрофон недоступен — напишите текстом')};
    try{r.start();REC=r;b.classList.add('rec');b.textContent='■';toast('Говорите — нажмите ■, когда закончите')}catch(e){}}}

/* ---------- скачать: без вызова модели ---------- */
function openDl(btn){var m=$('#dl'),r=btn.getBoundingClientRect();m.classList.add('on');var top=r.top-m.offsetHeight-8;m.style.top=(top<8?r.bottom+8:top)+'px';m.style.left=Math.max(8,Math.min(innerWidth-m.offsetWidth-8,r.left))+'px';
  setTimeout(function(){document.addEventListener('click',function c(e){if(!m.contains(e.target)){m.classList.remove('on');document.removeEventListener('click',c)}})},0)}
document.querySelectorAll('#dl button').forEach(function(b){b.onclick=function(){$('#dl').classList.remove('on');var f=b.getAttribute('data-f');if(!ST||!ST.doc||!ST.doc.program){toast('Пока нечего скачивать');return}
  var nm=((ST.title||CUR.title||'Урок').replace(/[\\/:*?"<>|]+/g,' ').trim()).slice(0,80);
  if(f==='md')save(new Blob([ST.ai_md||''],{type:'text/markdown;charset=utf-8'}),nm+' — для нейросети.md');else save(docx(),nm+' — тексты слайдов.docx')}});
function save(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);toast('Скачиваю: '+name)}
function xe(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function runs(s,base){var out=[],re=/(\*\*.+?\*\*|==.+?==|\[[^\]]+\]\(https?:[^)]+\))/g,i=0,m;s=String(s).replace(/<!--.*?-->/g,'');
  function r(t,o){o=o||{};if(!t)return;out.push('<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>'+((o.b||base.b)?'<w:b/>':'')+(o.c?'<w:color w:val="'+o.c+'"/>':'')+(o.hl?'<w:highlight w:val="yellow"/>':'')+'<w:sz w:val="'+(base.sz||24)+'"/></w:rPr><w:t xml:space="preserve">'+xe(t)+'</w:t></w:r>')}
  while(m=re.exec(s)){r(s.slice(i,m.index));var x=m[0];if(x[0]==='*')r(x.slice(2,-2),{b:1,c:/:$/.test(x.slice(2,-2))?'5B6270':''});else if(x[0]==='=')r(x.slice(2,-2),{hl:1});else{var mm=x.match(/\[([^\]]+)\]\(([^)]+)\)/);r(mm[1]+' ('+mm[2]+')',{c:'1745E0'})}i=m.index+x.length}
  r(s.slice(i));return out.join('')}
function para(s,o){o=o||{};return '<w:p><w:pPr><w:spacing w:before="'+(o.bf||0)+'" w:after="'+(o.af==null?80:o.af)+'"/>'+(o.ind?'<w:ind w:left="360" w:hanging="240"/>':'')+'</w:pPr>'+runs(s,o)+'</w:p>'}
function mdDocx(t){var o=[];String(t||'').split('\n').forEach(function(l){var m;if(!l.trim())return;
  if(m=l.match(/^##\s+(.*)/))o.push(para(m[1],{b:1,sz:30,bf:200,af:120}));else if(m=l.match(/^###\s+(.*)/))o.push(para(m[1],{b:1,sz:26,bf:240,af:80}));
  else if(m=l.match(/^\s*[-•]\s+(.*)/))o.push(para('•  '+m[1],{ind:1}));else if(m=l.match(/^\s*(\d+)[.)]\s+(.*)/))o.push(para(m[1]+'.  '+m[2],{ind:1}));else o.push(para(l))});return o.join('')}
function docx(){var d=ST.doc||{},t=ST.title||CUR.title||'Урок';
  var body=para(t,{b:1,sz:36,af:60})+para('Академия Сметного Дела · тексты слайдов от Сократа (методист)',{c:1,af:240})+
    para('Жёлтым — ключевые слова: Малевич выделит их на слайде, Гудвин покажет крупно при монтаже.',{af:240})+
    para('Программа урока',{b:1,sz:30,bf:120})+mdDocx(String(d.program||'').replace(/^##\s+/m,'### '))+(d.slides?para('Слайды',{b:1,sz:30,bf:360})+mdDocx(d.slides):'');
  var doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>';
  return zip([['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
    ['word/document.xml',doc]])}
var CRC=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){var enc=new TextEncoder(),parts=[],cd=[],off=0;
  function u16(v){return [v&255,(v>>>8)&255]}function u32(v){return [v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]}
  files.forEach(function(f){var nm=enc.encode(f[0]),da=enc.encode(f[1]),c=crc(da);
    var lh=[].concat([0x50,0x4b,3,4],u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(c),u32(da.length),u32(da.length),u16(nm.length),u16(0));
    parts.push(new Uint8Array(lh),nm,da);
    cd.push(new Uint8Array([].concat([0x50,0x4b,1,2],u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(c),u32(da.length),u32(da.length),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off))),nm);
    off+=lh.length+nm.length+da.length});
  var cds=cd.reduce(function(s,x){return s+x.length},0);
  return new Blob(parts.concat(cd,[new Uint8Array([].concat([0x50,0x4b,5,6],u16(0),u16(0),u16(files.length),u16(files.length),u32(cds),u32(off),u16(0)))]),{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}

/* 11.11 (Руслан: «выделить смысл»): кнопка жёлтого — прямо над выделенными словами */
function selSo(){var s=getSelection();if(!s.rangeCount||s.isCollapsed)return null;var n=s.anchorNode;n=n&&(n.nodeType===1?n:n.parentNode);
  var tx=n&&n.closest&&n.closest('.so .txt');if(!tx||!tx.contains(s.focusNode))return null;var so=tx.closest('.so'),m=msg(so.getAttribute('data-id'));
  if(!m||(m.kind!=='slides'&&m.kind!=='edit'))return null;if(n.closest('.legend'))return null;return so}
function fbPlace(){var b=$('#fb');if(!b)return;var so=selSo();if(!so){b.classList.remove('on');return}
  var s=getSelection(),r=s.getRangeAt(0).getBoundingClientRect(),c=s.getRangeAt(0).commonAncestorContainer;c=c.nodeType===1?c:c.parentNode;
  b.textContent=c.closest('mark')?'Снять выделение':'🖍 Выделить смысл';b.classList.add('on');
  var x=Math.max(8,Math.min(innerWidth-b.offsetWidth-8,r.left+r.width/2-b.offsetWidth/2)),y=r.top+scrollY-b.offsetHeight-10;if(r.top<70)y=r.bottom+scrollY+10;
  b.style.left=x+'px';b.style.top=y+'px';b._so=so}
document.addEventListener('mouseup',function(){setTimeout(fbPlace,10)});document.addEventListener('keyup',function(e){if(e.shiftKey||e.key==='Shift')fbPlace()});
document.addEventListener('selectionchange',function(){var s=getSelection();if(!s.rangeCount||s.isCollapsed){var b=$('#fb');if(b)b.classList.remove('on')}});
window.addEventListener('scroll',function(){var b=$('#fb');if(b&&b.classList.contains('on'))fbPlace()},{passive:true});
document.addEventListener('dblclick',function(e){if(EDIT)return;var so=selSo();if(!so)return;var b=$('#fb');if(b)b.classList.remove('on');yellow(so,so.getAttribute('data-id'));try{getSelection().removeAllRanges()}catch(x){}});   /* 11.11 (Руслан: «по щелчку мышки»): двойной щелчок по слову — сразу жёлтое, без кнопки */
$('#fb').addEventListener('mousedown',function(e){e.preventDefault();var so=this._so;this.classList.remove('on');if(so)yellow(so,so.getAttribute('data-id'))});
document.addEventListener('mousedown',function(e){var h=e.target.closest&&e.target.closest('.legend .hlx');if(!h)return;e.preventDefault();var so=selSo();
  if(so)yellow(so,so.getAttribute('data-id'));else toast('Сначала выделите слова мышкой в тексте слайда — рядом появится жёлтая кнопка',3600)});

boot();
})();

<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Гуля · мои работы — Академия сметного дела</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Одна ссылка для эксперта (Руслан 27.10): вход по имени и паролю → «Мои презентации» → «＋ Новая презентация». Стиль — как стартовая страница. */
:root{--bg:#F4F6FA;--ink:#14213D;--ink2:#5B6680;--line:#DCE2EE;--navy:#0F1E5A;--blue:#1745E0;--soft:#EEF3FD;--pink:#E8336D;--green:#2E7D32;--amber:#B26A00;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 Rubik,system-ui,-apple-system,sans-serif}
.top{display:flex;align-items:center;gap:14px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.top img{height:38px}.top .sp{flex:1}
.out{border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:16px;border-radius:12px;min-height:44px;padding:0 16px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:24px 16px 80px}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 2px 12px rgba(15,30,90,.06)}
.login{max-width:440px;margin:6vh auto 0}
h1{margin:0 0 6px;font-size:28px;line-height:1.2}h1 span{color:var(--blue)}
p{margin:0 0 14px;color:var(--ink2)}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:16px;min-height:54px;color:var(--ink)}
input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(15,30,90,.12)}
.rem{display:flex;gap:10px;align-items:center;font-weight:400;color:var(--ink2);font-size:16px}.rem input{width:22px;height:22px}
.go{display:block;width:100%;margin-top:18px;min-height:58px;border:0;border-radius:18px;background:var(--navy);color:#fff;font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.err{color:var(--pink);min-height:1.4em;margin-top:10px;font-size:16px}
.gulya{display:flex;gap:16px;align-items:flex-start;margin:4px 0 20px}
.gulya img{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 4px #fff,0 0 0 6px #F2C29B}
.bubble{background:#fff;border-radius:22px;padding:14px 18px;font-size:19px;box-shadow:0 2px 12px rgba(15,30,90,.06)}
.bubble .who{font-size:14px;color:var(--ink2);margin-bottom:2px}
.play{border:0;background:var(--soft);color:var(--navy);font:inherit;font-size:15px;border-radius:12px;padding:6px 14px;margin-top:8px;cursor:pointer;min-height:44px}
.new{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:72px;border:0;border-radius:22px;background:var(--navy);color:#fff;font:inherit;font-size:23px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 8px 22px rgba(15,30,90,.22)}
.new:hover{background:#16297A}.new b{font-size:30px;line-height:1}
.call{display:none}
h2{font-size:21px;margin:30px 0 12px}
.list{display:grid;gap:12px}
.deck{background:#fff;border-radius:20px;padding:18px 20px;box-shadow:0 2px 12px rgba(15,30,90,.05);display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.deck .t{font-weight:600;font-size:19px;line-height:1.3}
.deck .m{color:var(--ink2);font-size:16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.st{display:inline-block;border-radius:10px;padding:2px 10px;font-size:15px;font-weight:600}
.st.wait{background:#FFF1DE;color:var(--amber)}.st.busy{background:#E4ECFC;color:var(--blue)}.st.ok{background:#E3F4E7;color:var(--green)}.st.make{background:#F1EEFB;color:#5B3FB0}
.cont{grid-row:span 2;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-size:17px;font-weight:600;min-height:48px;padding:0 20px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.cont[aria-disabled=true]{background:#C9D3E8;pointer-events:none}
.empty{color:var(--ink2)}
.arch{margin-top:22px}.arch summary{cursor:pointer;font-weight:600;font-size:18px;min-height:44px;display:flex;align-items:center;color:var(--ink2)}.arch summary::before{content:'▸';margin-right:8px;color:var(--navy)}.arch[open] summary::before{content:'▾'}.arch summary::-webkit-details-marker{display:none}.arch summary{list-style:none}.arch .deck{opacity:.85}
.act.ar{color:var(--ink2)}
.kind{display:inline-block;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;background:var(--soft);color:var(--navy);margin-bottom:4px}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.act{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:16px;text-decoration:none;cursor:pointer}
.act:hover{border-color:var(--navy)}[hidden]{display:none!important}.act.recon{border-color:#F3B5B5;color:#B3261E}
.vers{grid-column:1/-1;margin:2px 0 0;padding:10px 14px;background:var(--bg);border-radius:12px;font-size:16px}.vers a{color:var(--blue)}.vers li{margin:2px 0}
.pick{display:grid;gap:8px;margin-top:10px}.pick button{min-height:48px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-size:18px;text-align:left;padding:8px 16px;cursor:pointer}.pick button:hover{border-color:var(--navy)}
.voice{border:0;border-radius:14px;background:var(--navy);color:#fff;font:inherit;font-size:16px;font-weight:600;padding:0 16px;margin-top:10px;cursor:pointer;min-height:44px}.voice.on{background:var(--soft);color:var(--navy);font-weight:500}
@media(max-width:560px){.deck{grid-template-columns:1fr}.cont{grid-row:auto;justify-content:center}.new{font-size:21px}h1{font-size:24px}}
</style></head><body>
<header class="top"><img src="img/logo.png" alt="Академия сметного дела"><span class="sp"></span><button type="button" class="out" id="out" hidden>Выйти</button></header>
<main>
<form id="f" class="card login"><h1>Академия <span>сметного дела</span></h1><p>Ваши презентации и дизайнер Гульнара. Введите логин (или имя) и пароль.</p>
<label for="nm">Логин или имя</label><input id="nm" type="text" autocomplete="username" autocapitalize="off" placeholder="Например: Anna18" required>
<label for="pw">Пароль</label><input id="pw" type="password" autocomplete="current-password" required>
<label class="rem"><input id="rem" type="checkbox" checked> Запомнить на этом устройстве на 30 дней</label>
<button type="submit" class="go">Войти</button><div class="err" id="err" role="alert"></div><div class="pick" id="pick" hidden></div></form>
<section id="me" hidden>
<div class="gulya"><img src="img/gulya.jpg" alt="Гульнара Сафина, дизайнер Академии"><div class="bubble"><div class="who">Гульнара Сафина · дизайнер Академии</div><span id="say"></span><br><button type="button" class="voice" id="voice"></button></div></div>
<a class="new" id="new" href="start/"><b>＋</b> Новая работа с Гулей</a>
<a class="act" id="panel" href="akademiya/" hidden style="margin-top:12px">🏛 Панель Академии — все работы и записи уроков</a>
<button type="button" class="call" id="call" hidden>🎙 Созвон с Гулей</button>
<h2>Мои работы</h2><div class="list" id="ls"></div>
<details class="arch" id="arch" hidden><summary id="archh">Архив</summary><div class="list" id="als"></div></details>
</section></main>

async function sha(s){var d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(d)).map(function(x){return('0'+x.toString(16)).slice(-2)}).join('')}

  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:hex(salt||SALT),iterations:ITER,hash:'SHA-256'},k,384))}
async function dec(b,data){var ct=b64(data||DATA);if(String.fromCharCode.apply(null,ct.slice(0,8))==='Salted__')ct=ct.slice(16);
  var key=await crypto.subtle.importKey('raw',b.slice(0,32),'AES-CBC',false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:b.slice(32,48)},key,ct)))}
function b2s(b){return btoa(String.fromCharCode.apply(null,b))}
/* общий пароль Академии (ASD18): регистр и пробелы не важны; на устройстве — ключ со сроком (30 дней или до конца дня); уроки и стартовая узнают ключ сами */
function keep(salt,k,exp){ls('sf-key-'+salt,k);ls('sf-exp-'+salt,String(exp))}
function logout(){var ck=null;try{ck=JSON.parse(ls('pe-hub-me')||'{}').cs}catch(e){}if(ck){ls('sf-key-'+ck,null);ls('sf-exp-'+ck,null)}
  ['pe-hub-k','pe-hub-exp','pe-hub-who','pe-hub-me','pe-hub-new','sf-author','pe-hub-acc'].forEach(function(k){ls(k,null)});try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('pe-hub-seen-')===0)localStorage.removeItem(k)})}catch(e){}location.reload()}
$('#out').onclick=logout;
function pick(k){var a=LINES[k]||[];return a.length?a[Math.floor(Math.random()*a.length)]:''}
/* голос Гули — только по кнопке; выбор запоминается на устройстве; и включённый звучит лишь после нажатия на странице (Руслан 27.10) */
var VOICE=ls('pe-voice')==='1',LINE='',snd=null,touched=false;
function vUi(){var b=$('#voice');b.textContent=VOICE?'🔇 Только текст':'🔊 Включить голос Гули';b.classList.toggle('on',VOICE);b.setAttribute('aria-pressed',VOICE?'true':'false')}
function play(){if(!VOICE||!AUD[LINE])return;try{if(snd)snd.pause();snd=new Audio(AUD[LINE]);var p=snd.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
$('#voice').onclick=function(e){e.stopPropagation();VOICE=!VOICE;ls('pe-voice',VOICE?'1':'0');vUi();if(VOICE)play();else if(snd)snd.pause()};
document.addEventListener('pointerdown',function(e){if(touched||(e.target.closest&&e.target.closest('#voice')))return;touched=true;play()},true);
function status(d,live){if(d.building)return['make','Гуля собирает'];if(live.busy)return['busy','Гуля правит'];if(d.stage==='approved'||d.stage==='final'||(d.n&&live.ok>=d.n))return['ok','Готово ✓'];return['wait','Ждёт Вас']}
function fmt(ms){if(!ms)return'';var d=new Date(ms),p=function(n){return('0'+n).slice(-2)};return p(d.getDate())+'.'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())}
function card(d,live){var s=status(d,live),acc=d.building?'Пришлю ссылку, когда первые слайды будут готовы':(d.n?'принято '+(live.ok||0)+' из '+d.n:''),i=CARDS.push(d)-1;
  var acts=d.building?'':'<div class="acts">'+(d.pptx?'<a class="act" href="'+esc(d.pptx)+'">⬇ Скачать PPTX</a>':'')+(d.pdf?'<a class="act" href="'+esc(d.pdf)+'">⬇ Скачать PDF</a>':'')+
    ((d.vers||[]).length?'<button type="button" class="act" data-vers="'+i+'">🕘 История версий</button>':'')+(d.rec?'<a class="act recon" href="'+esc(d.url)+'zapis/">🎥 Записать урок</a>':'')+(d.deck?(ARCH[d.deck]?'<button type="button" class="act ar" data-unarch="'+esc(d.deck)+'">↩ Вернуть</button>':'<button type="button" class="act ar" data-arch="'+esc(d.deck)+'">🗄 В архив</button>'):'')+'</div>';
  return '<div class="deck"><div><span class="kind">'+esc(d.kind||'новая работа')+'</span><div class="t">'+esc(d.title)+(d.who?' <small style="color:var(--ink2);font-weight:400">· '+esc(d.who)+'</small>':'')+(d.demo&&!d.who?' <small style="color:var(--ink2);font-weight:400">· пробная</small>':'')+'</div></div>'+
    (d.building?'<span class="cont" aria-disabled="true">Скоро</span>':'<a class="cont" href="'+esc(d.url)+'">Продолжить</a>')+
    '<div class="m"><span class="st '+s[0]+'">'+s[1]+'</span><span>'+esc(acc)+'</span>'+(d.mt?'<span>изменено '+fmt(d.mt)+'</span>':'')+'</div>'+acts+'</div>'}
var CARDS=[];document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-vers]');if(!b)return;var d=CARDS[+b.getAttribute('data-vers')],box=b.closest('.deck'),old=box.querySelector('.vers');
  if(old){old.remove();return}var u=document.createElement('ul');u.className='vers';u.innerHTML=d.vers.map(function(v,j){return '<li>Версия '+v[0]+(j===0?' (сейчас)':'')+' · '+fmt(v[1])+' — <a href="'+esc(d.url)+'history/">что менялось</a></li>'}).join('');box.appendChild(u)});
function H(tok){var h={apikey:SB.key,Authorization:'Bearer '+SB.key};if(tok)h['x-pe-token']=tok;return h}
async function liveOf(d){var r={busy:false,ok:0};if(d.building)return r;var base=SB.url.replace(/\/$/,'')+'/rest/v1/';
  try{var j=await fetch(base+'pe_jobs?select=id&deck=eq.'+encodeURIComponent(d.deck)+'&status=in.(queued,processing)&limit=1',{headers:H(d.tok)});if(j.ok)r.busy=(await j.json()).length>0}catch(e){}
  try{var v=await fetch(base+'sf_votes?select=section,verdict,updated_at&order=updated_at&section=like.'+encodeURIComponent('pe_'+d.deck+'_v*'),{headers:H(d.tok)});
    if(v.ok){var last={};(await v.json()).forEach(function(x){var m=/_v\d+_(.+)$/.exec(x.section);if(m)last[m[1]]=x.verdict});r.ok=Object.keys(last).filter(function(k){return last[k]==='keep'}).length}}catch(e){}
  return r}
/* имя: «Имя Фамилия», «Фамилия Имя», полное ФИО или одно имя/фамилия, если однозначно; иначе — выбор */
function match(q,E){q=norm(q);if(!q)return[];var w=q.split(' ');return E.filter(function(e){var f=norm(e.first),l=norm(e.last),full=norm(e.full);
  if(q===full||q===f+' '+l||q===l+' '+f||q===norm(e.io)||q===norm(e.io)+' '+l)return true;if(w.length===1)return w[0]===f||w[0]===l;return w.indexOf(l)>=0&&(w.indexOf(f)>=0)})}
async function show(e,ck,first){$('#f').hidden=true;$('#me').hidden=false;$('#out').hidden=false;
  var seen=ls('pe-hub-seen-'+e.code);LINE=seen?pick('hub_return'):pick('hub_first');ls('pe-hub-seen-'+e.code,'1');
  $('#say').textContent=(LINE||'{ИО}, здравствуйте!').replace(/\{ИО\}/g,e.io);vUi();if(first)touched=true;
  ls('pe-hub-me',JSON.stringify({io:e.io,code:e.code,name:e.full,cs:ck&&ck.s}));$('#panel').hidden=!e.panel;ls('sf-author',e.io);   /* голоса и правки — под именем вошедшего эксперта */
  logIn(e,first);
  var pend=[];try{pend=JSON.parse(ls('pe-hub-new')||'[]')}catch(x){}
  pend=pend.filter(function(p){return Date.now()-p.t<2*DAY&&!e.decks.some(function(d){return d.t>=p.t-120000})});ls('pe-hub-new',JSON.stringify(pend));
  var all=pend.map(function(p){return{title:p.title||'Новая презентация',building:true}}).concat(e.decks);
  if(!all.length){$('#ls').innerHTML='<p class="empty">Пока работ нет. Нажмите «Новая работа с Гулей» — расскажите голосом, что нужно, или загрузите черновик.</p>';return}
  ALL=all;await loadArch();drawAll(null);var lv=await Promise.all(all.map(liveOf));drawAll(lv)}
/* вход в кабинет — запись для Руслана (28.10): sf_comments «hub_login»; основателя не пишем; с одного браузера не чаще раза в 30 мин; ошибка не мешает входу */
function logIn(e,pw){try{if(e.role==='founder'||e.code==='valiev'||!e.code)return;   /* Руслан (и как основатель, и «Руслан + ASD18») — не пишем */var k='pe-hub-logged-'+e.code,t=+ls(k)||0;if(Date.now()-t<30*60000)return;ls(k,String(Date.now()));
  fetch(SB.url.replace(/\/$/,'')+'/rest/v1/sf_comments',{method:'POST',headers:Object.assign(SBH(),{'Content-Type':'application/json',Prefer:'return=minimal'}),
    body:JSON.stringify({section:'hub_login',voter:e.code,author:e.full||e.io,body:pw?'[вход] пароль':'[вход] запомнен'})}).catch(function(){})}catch(x){}}
var ALL=[],LV=null,ARCH={};
function drawAll(lv){if(lv)LV=lv;CARDS=[];var main=[],arc=[];ALL.forEach(function(d,i){var h=card(d,(LV||[])[i]||{busy:false,ok:0});(d.deck&&ARCH[d.deck]?arc:main).push(h)});
  $('#ls').innerHTML=main.length?main.join(''):'<p class="empty">Все работы в архиве. Нажмите «Новая работа с Гулей», чтобы начать новую.</p>';$('#arch').hidden=!arc.length;$('#archh').textContent='Архив ('+arc.length+')';$('#als').innerHTML=arc.join('')}
/* архив (Руслан 27.10): только флаг — страница, записи и файлы остаются; хранится в базе: sf_votes «arch_<колода>», drop = в архиве, keep = вернули */
function SBH(){return{apikey:SB.key,Authorization:'Bearer '+SB.key}}
async function loadArch(){try{var r=await fetch(SB.url.replace(/\/$/,'')+'/rest/v1/sf_votes?select=section,verdict&voter=eq.hub&section=like.arch_*',{headers:SBH()});if(!r.ok)return;ARCH={};(await r.json()).forEach(function(x){ARCH[x.section.slice(5)]=x.verdict==='drop'})}catch(e){}}
async function setArch(deck,on){var me={};try{me=JSON.parse(ls('pe-hub-me')||'{}')}catch(e){}
  var r=await fetch(SB.url.replace(/\/$/,'')+'/rest/v1/sf_votes?on_conflict=section,voter',{method:'POST',headers:Object.assign(SBH(),{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify({section:'arch_'+deck,voter:'hub',author:(me.io||'')+(on?' · в архив':' · вернул(а)'),verdict:on?'drop':'keep',updated_at:new Date().toISOString()})});if(!r.ok)throw r.status;ARCH[deck]=on;drawAll(null)}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-arch],[data-unarch]');if(!a)return;var d=a.getAttribute('data-arch'),u=a.getAttribute('data-unarch');
  if(d){if(!confirm('Убрать работу в архив? Её можно вернуть.'))return;setArch(d,true).catch(function(){alert('Не получилось — проверьте интернет и нажмите ещё раз')})}
  else setArch(u,false).then(function(){$('#arch').open=false}).catch(function(){alert('Не получилось — проверьте интернет и нажмите ещё раз')})});
function enter(x,e,kb,exp){keep(x.ck.s,x.ck.k,exp);ls('pe-hub-k',kb);ls('pe-hub-exp',String(exp));ls('pe-hub-who',e.code);show(e,x.ck,true)}
(async function(){try{var who=ls('pe-hub-who'),kb=ls('pe-hub-k'),exp=+ls('pe-hub-exp')||0,ah=ls('pe-hub-acc');if(!who||!kb)return;if(exp<Date.now()){logout();return}
  if(ah&&ACC[ah]){var y=await dec(b64(kb),ACC[ah].data);await show(y,y.ck,false);return}
  var x=await dec(b64(kb)),e=x.experts.filter(function(z){return z.code===who})[0];if(e)await show(e,x.ck,false)}catch(e){logout()}})();
$('#f').addEventListener('submit',async function(ev){ev.preventDefault();var err=$('#err'),pk=$('#pick');pk.hidden=true;pk.innerHTML='';err.textContent='Проверяю…';
  var exp=$('#rem').checked?Date.now()+30*DAY:new Date().setHours(23,59,59,0),pw=npw($('#pw').value);
  var ah=await sha('acc:'+$('#nm').value.trim().toLowerCase());if(ACC[ah]){try{var ba=await bits(pw,ACC[ah].salt),y=await dec(ba,ACC[ah].data);err.textContent='';
      keep(y.ck.s,y.ck.k,exp);ls('pe-hub-k',b2s(ba));ls('pe-hub-exp',String(exp));ls('pe-hub-who',y.code);ls('pe-hub-acc',ah);show(y,y.ck,true);return}catch(_){err.textContent='Пароль не подходит. Проверьте и попробуйте ещё раз.';return}}
  var x,b;try{b=await bits(pw);x=await dec(b)}catch(_){err.textContent='Пароль не подходит. Проверьте и попробуйте ещё раз.';return}
  ls('pe-hub-acc',null);var kb=b2s(b),m=match($('#nm').value,x.experts);
  if(m.length===1){err.textContent='';enter(x,m[0],kb,exp);return}
  if(!m.length){err.textContent='Не нашли «'+$('#nm').value.trim()+'» среди экспертов Академии. Проверьте, пожалуйста, имя и фамилию — или напишите Руслану.';return}
  var list=m;err.textContent='Нашли несколько — выберите себя:';
  pk.innerHTML=list.map(function(e,i){return '<button type="button" data-i="'+i+'">'+esc(e.full)+'</button>'}).join('');pk.hidden=false;
  [].forEach.call(pk.querySelectorAll('button'),function(btn){btn.onclick=function(){err.textContent='';enter(x,list[+btn.getAttribute('data-i')],kb,exp)}})});
</script></body></html>

body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 Rubik,system-ui,-apple-system,sans-serif}
.top{display:flex;align-items:center;gap:14px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.top img{height:38px}.top .sp{flex:1}
.out{border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:16px;border-radius:12px;min-height:44px;padding:0 16px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:24px 16px 80px}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 2px 12px rgba(15,30,90,.06)}
.login{max-width:440px;margin:6vh auto 0}
h1{margin:0 0 6px;font-size:28px;line-height:1.2}h1 span{color:var(--blue)}
p{margin:0 0 14px;color:var(--ink2)}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:1.5px solid var(--line);border-radius:16px;min-height:54px;color:var(--ink)}
input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(15,30,90,.12)}
.rem{display:flex;gap:10px;align-items:center;font-weight:400;color:var(--ink2);font-size:16px}.rem input{width:22px;height:22px}
.go{display:block;width:100%;margin-top:18px;min-height:58px;border:0;border-radius:18px;background:var(--navy);color:#fff;font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.err{color:var(--pink);min-height:1.4em;margin-top:10px;font-size:16px}
.gulya{display:flex;gap:16px;align-items:flex-start;margin:4px 0 20px}
.gulya img{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 4px #fff,0 0 0 6px #F2C29B}
.bubble{background:#fff;border-radius:22px;padding:14px 18px;font-size:19px;box-shadow:0 2px 12px rgba(15,30,90,.06)}
.bubble .who{font-size:14px;color:var(--ink2);margin-bottom:2px}
.play{border:0;background:var(--soft);color:var(--navy);font:inherit;font-size:15px;border-radius:12px;padding:6px 14px;margin-top:8px;cursor:pointer;min-height:44px}
.new{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:72px;border:0;border-radius:22px;background:var(--navy);color:#fff;font:inherit;font-size:23px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 8px 22px rgba(15,30,90,.22)}
.new:hover{background:#16297A}.new b{font-size:30px;line-height:1}
.call{display:none}
h2{font-size:21px;margin:30px 0 12px}
.list{display:grid;gap:12px}
.deck{background:#fff;border-radius:20px;padding:18px 20px;box-shadow:0 2px 12px rgba(15,30,90,.05);display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.deck .t{font-weight:600;font-size:19px;line-height:1.3}
.deck .m{color:var(--ink2);font-size:16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.st{display:inline-block;border-radius:10px;padding:2px 10px;font-size:15px;font-weight:600}

.cont[aria-disabled=true]{background:#C9D3E8;pointer-events:none}
.empty{color:var(--ink2)}
@media(max-width:560px){.deck{grid-template-columns:1fr}.cont{grid-row:auto;justify-content:center}.new{font-size:21px}h1{font-size:24px}}

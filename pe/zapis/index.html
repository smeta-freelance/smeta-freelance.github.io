===\n   asd-ui.css — дизайн-система сервиса «Гуля» Академии Сметного Дела, v1 (28.10.2026)\n   Стиль: спокойный современный SaaS (Linear / Notion / Loom) · только светлая тема.\n   Все классы с приставкой ui-, переменные — --ui-*: не спорят со старыми стилями страниц.\n   Страницы собираются одним файлом — содержимое этого файла вставляется в <style>\n   между метками «asd-ui.css v1 — начало / конец». Иконки — Lucide (SVG-спрайт, см. образец.html).\n   ========================================================================== */\n:root{\n  /* бренд АСД */\n  --ui-navy:#0F1E5A;--ui-navy-700:#16276E;--ui-navy-50:#EEF0F8;\n  --ui-blue:#1745E0;--ui-blue-600:#1338B8;--ui-blue-100:#DCE5FD;--ui-blue-50:#EEF3FE;\n  --ui-pink:#E8336D;--ui-pink-600:#C81E57;--ui-pink-50:#FDEBF1;\n  /* нейтральные */\n  --ui-g0:#FFFFFF;--ui-g25:#FAFBFD;--ui-g50:#F5F7FB;--ui-g100:#EEF1F6;--ui-g200:#E2E7F0;--ui-g300:#CBD3E1;\n  --ui-g400:#9AA5BB;--ui-g500:#6B7690;--ui-g600:#4E5874;--ui-g700:#353E58;--ui-g900:#141B33;\n  /* смысловые */\n  --ui-ok:#1F8A4C;--ui-ok-50:#E7F6EC;--ui-ok-200:#B7E2C6;\n  --ui-warn:#9A5B00;--ui-warn-500:#F2A33D;--ui-warn-50:#FFF4E0;--ui-warn-200:#F5D199;\n  --ui-rec:#E0312B;--ui-rec-600:#C4241F;--ui-rec-50:#FDECEB;--ui-rec-200:#F6C1BE;\n  /* форма */\n  --ui-r-xs:6px;--ui-r-sm:10px;--ui-r-md:14px;--ui-r-lg:20px;--ui-r-pill:999px;\n  --ui-s1:4px;--ui-s2:8px;--ui-s3:12px;--ui-s4:16px;--ui-s5:24px;--ui-s6:32px;\n  --ui-sh-xs:0 1px 2px rgba(16,24,40,.06);\n  --ui-sh-sm:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);\n  --ui-sh-md:0 6px 16px -4px rgba(15,30,90,.10),0 2px 4px -2px rgba(15,30,90,.06);\n  --ui-sh-lg:0 20px 48px -12px rgba(15,30,90,.24);\n  --ui-ring:0 0 0 3px rgba(23,69,224,.28);\n  /* шрифт — один: Rubik */\n  --ui-font:Rubik,system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --ui-fs:17px;--ui-fs-sm:16px;--ui-fs-lg:20px;--ui-fs-xl:24px;--ui-fs-2xl:30px;\n  --ui-ease:cubic-bezier(.2,.7,.3,1);\n}\n.ui-root{margin:0;background:var(--ui-g50);color:var(--ui-g900);font:400 var(--ui-fs)/1.5 var(--ui-font);-webkit-font-smoothing:antialiased}\n.ui-root *,.ui-root *::before,.ui-root *::after{box-sizing:border-box}\n\n/* ---------- типографика ---------- */\n.ui-h1{font:700 var(--ui-fs-2xl)/1.2 var(--ui-font);letter-spacing:-.02em;color:var(--ui-navy);margin:0}\n.ui-h2{font:600 var(--ui-fs-xl)/1.25 var(--ui-font);letter-spacing:-.015em;color:var(--ui-navy);margin:0}\n.ui-h3{font:600 var(--ui-fs-lg)/1.3 var(--ui-font);letter-spacing:-.01em;color:var(--ui-g900);margin:0}\n.ui-eyebrow{font:600 var(--ui-fs-sm)/1.3 var(--ui-font);color:var(--ui-g500);margin:0}\n.ui-text-muted{color:var(--ui-g600)}\n.ui-kbd{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border:1px solid var(--ui-g300);border-bottom-width:2px;border-radius:var(--ui-r-xs);background:var(--ui-g0);font:600 15px/1 var(--ui-font);color:var(--ui-g700)}\n\n/* ---------- иконки (Lucide) ---------- */\n.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}\n.ic--sm{width:18px;height:18px}.ic--lg{width:24px;height:24px}.ic--xl{width:28px;height:28px}\n.ic--fill{fill:currentColor}\n\n/* ---------- кнопки ---------- */\n.ui-btn{--h:48px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--ui-s2);min-height:var(--h);padding:0 18px;\n  border:1px solid transparent;border-radius:var(--ui-r-sm);font:600 var(--ui-fs)/1.2 var(--ui-font);letter-spacing:-.005em;text-decoration:none;white-space:nowrap;\n  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;\n  transition:background-color .15s var(--ui-ease),border-color .15s var(--ui-ease),color .15s var(--ui-ease),box-shadow .15s var(--ui-ease),transform .08s}\n.ui-btn:focus-visible{outline:0;box-shadow:var(--ui-ring)}\n.ui-btn:active:not(:disabled){transform:translateY(1px)}\n.ui-btn:disabled,.ui-btn[aria-disabled=\"true\"]{curs

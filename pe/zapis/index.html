lass=\"mtxt\" id=\"mtxt\">Нажмите «Проверить» и скажите пару слов — полоска станет зелёной.<\/p>\n      <\/div>\n      <div class=\"campanel off\" id=\"campanel\">\n        <div class=\"ph\" id=\"ph\"><svg class=\"ic ic--lg\"><use href=\"#i-video\"/><\/svg><span>Камера включится, когда Вы нажмёте «Проверить» или «Начать запись»<\/span><\/div>\n        <div class=\"cam\" id=\"camBox\"><video id=\"cam\" autoplay muted playsinline><\/video><\/div>\n        <canvas class=\"fx\" id=\"fxA\" aria-hidden=\"true\"><\/canvas><span class=\"fxtag\"><svg class=\"ic\"><use href=\"#i-image\"/><\/svg>Так будет с фоном<\/span>\n      <\/div>\n      <p class=\"cpq g2o\" id=\"cpQ\" hidden aria-live=\"polite\"><\/p>\n      <div id=\"tipsHome1\"><\/div>\n      <div id=\"bgHome1\"><div class=\"bgbox\" id=\"bgBox\">\n        <p class=\"sub\" id=\"bgT\">Фон за спиной в готовом уроке<\/p>\n        <div class=\"bgs\" role=\"group\" aria-labelledby=\"bgT\">\n          <button type=\"button\" class=\"bgc\" data-bg=\"none\"><canvas width=\"128\" height=\"128\"><\/canvas><span>Как есть<\/span><\/button>\n          <button type=\"button\" class=\"bgc\" data-bg=\"blur\"><canvas width=\"128\" height=\"128\"><\/canvas><span>Размыть мой фон<\/span><\/button>\n          <button type=\"button\" class=\"bgc\" data-bg=\"light\"><canvas width=\"128\" height=\"128\"><\/canvas><span>Светлый<\/span><\/button>\n          <button type=\"button\" class=\"bgc\" data-bg=\"office\"><canvas width=\"128\" height=\"128\"><\/canvas><span>Кабинет<\/span><\/button>\n          <button type=\"button\" class=\"bgc\" data-bg=\"asd\"><canvas width=\"128\" height=\"128\"><\/canvas><span>Фирменный Академии<\/span><\/button>\n          <button type=\"button\" class=\"bgc g2o\" data-bg=\"akademiya\" hidden><canvas width=\"128\" height=\"128\"><\/canvas><span>Фон Академии<small class=\"tmp\" id=\"akTmp\" hidden>временный<\/small><\/span><\/button>\n        <\/div>\n        <p class=\"bgnote\" id=\"bgFx\" aria-live=\"polite\">Нажмите «Проверить звук и камеру» — покажу Вас на каждом фоне. Фон я поставлю при монтаже.<\/p>\n      <\/div><\/div>\n      <div id=\"scrBox\">\n        <input type=\"checkbox\" id=\"scr\" hidden>\n        <p class=\"scrnote\" id=\"scrNote\" hidden>🖥 Экран пишем, если хотите показать открытую программу (ГРАНД-Смета, Excel) или свою презентацию. После «Записи» браузер спросит, какое окно показать.<\/p>\n      <\/div>\n    <\/aside>\n    <section class=\"card left\" id=\"step2\">\n      <h2><span class=\"n\">2<\/span>Нажмите «Начать запись» и ведите урок<\/h2>\n      <p class=\"hint\" style=\"margin-bottom:10px\">Слайды — кнопки «Назад» и «Вперёд».<\/p>\n      <div class=\"stagewrap\" id=\"stagewrap\">\n      <div class=\"stagecol\">\n      <div class=\"stage\">\n        <img class=\"slide\" id=\"slide\" src=\"slides/01.jpg\" alt=\"Слайд урока\">\n        <video class=\"stagewin\" id=\"stageWin\" autoplay muted playsinline aria-label=\"Ваше окно\"><\/video><span class=\"wintag\">В записи — Ваше окно<\/span>\n        <span class=\"rec-dot\" id=\"recdot\" aria-live=\"polite\">REC<\/span>\n        <div class=\"banner\" id=\"banner\" role=\"status\"><span id=\"bmsg\"><\/span><button type=\"button\" id=\"undo\">Отменить<span class=\"kbd-h\"> (U)<\/span><\/button><\/div>\n        <div class=\"cd\" id=\"cd\" aria-hidden=\"true\"><\/div>\n        <div class=\"winon\" id=\"winOn\" hidden role=\"status\"><b>Сейчас в записи — Ваше окно<\/b><span>Слайды ждут здесь. Закончили показывать — нажмите:<\/span><button type=\"button\" class=\"ui-btn ui-btn--primary\" id=\"winBack\"><svg class=\"ic\"><use href=\"#i-image\"/><\/svg><span>Вернуться к слайдам<\/span><\/button><\/div>\n      <\/div>\n      <div class=\"ctl2\">\n        <div class=\"grp gs\" role=\"group\" aria-label=\"Листать слайды\">\n          <span class=\"lbl\">Слайды<\/span>\n          <button class=\"nb ui-btn ui-btn--secondary\" id=\"prev\" aria-label=\"Предыдущий слайд\"><svg class=\"ic\"><use href=\"#i-chev-l\"/><\/svg>Назад<\/button>\n          <span class=\"num\" id=\"num\">1 / __Z_N__<\/span><span class=\"take\" id=\"take\"><\/span>\n          <button class=\"nb ui-btn ui-btn--secondary\" id=\"next\" aria-label=\"Следующий слайд\">Вперёд<svg class=\"ic\"><use href=\"#i-chev-r\"/><\/svg><\/button>\n        <\/div>\n        <div class=\"grp gr\" role=\"group\" aria-label=\"Запись\">\n          <span class=\"lbl\">Запись<\/span>\n          <button class=\"c go ui-btn\" id=\"go\" aria-label=\"Начать запись\"><i><\/i><b class=\"g2wave\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/b><span>Начать запись<\/span><\/button>\n          <button class=\"c pz ui-btn ui-btn--warn\" id=\"pause\" disabled><svg class=\"ic\"><use href=\"#i-pause\"/><\/svg><span>Пауза<\/span><\/button>\n          <button class=\"c st ui-btn ui-btn--danger\" id=\"stop\" disabled><svg class=\"ic ic--fill\"><use href=\"#i-stop\"/><\/svg><span>Закончить запись<\/span><\/button>\n        <\/div>\n        <div class=\"grp gm\" role=\"group\" aria-label=\"Если сбились\">\n          <span class=\"lbl\">Сбились?<\/span>\n          <div class=\"mkw\"><button class=\"c mk ui-btn ui-btn--secondary ui-btn--sm\" id=\"retake\" disabled title=\"Клавиша R\"><svg class=\"ic\"><use href=\"#i-rotate\"/><\/svg>Сказать слайд заново<\/button><small>прежний дубль уберу<span class=\"kbd-h\"> · клавиша R<\/span><\/small><\/div>\n          <div class=\"mkw\"><button class=\"c mk ui-btn ui-btn--secondary ui-btn--sm\" id=\"skipcut\" disabled title=\"Клавиша X\"><svg class=\"ic\"><use href=\"#i-scissors\"/><\/svg>Убрать последнюю фразу<\/button><small id=\"skipH\">и повторите её целиком<span class=\"kbd-h\"> · клавиша X<\/span><\/small><\/div>\n        <\/div>\n        <div class=\"grp gw\" role=\"group\" aria-label=\"Показать другое окно\" id=\"gw\" hidden>\n          <span class=\"lbl\">Экран<\/span>\n          <div class=\"mkw\"><button class=\"c mk ui-btn ui-btn--secondary ui-btn--sm\" id=\"winBtn\" disabled><svg class=\"ic\"><use href=\"#i-monitor\"/><\/svg><span>Показать другое окно<\/span><\/button><small id=\"winH\">программу или сайт<span class=\"kbd-h\"> · клавиша W<\/span><\/small><\/div>\n          <button type=\"button\" class=\"lnk ui-btn ui-btn--ghost ui-btn--sm\" id=\"winSwap\" hidden>Выбрать другое окно<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"up\" id=\"up\" aria-live=\"polite\"><\/div>\n      <ul class=\"tips\" aria-label=\"Перед записью\">\n        <li><svg class=\"ic\"><use href=\"#i-bulb\"/><\/svg><span><b>Свет<\/b> — лицом к окну или лампе, не спиной.<\/span><\/li>\n        <li><svg class=\"ic\"><use href=\"#i-mute\"/><\/svg><span><b>Тишина<\/b> — закройте дверь, выключите звук телефона.<\/span><\/li>\n        <li><svg class=\"ic\"><use href=\"#i-timer\"/><\/svg><span><b>Проба 10 секунд<\/b> — «Начать запись», пара фраз, «Закончить запись», послушайте в «Моих записях».<\/span><\/li>\n        <li class=\"g2o\" hidden><svg class=\"ic\"><use href=\"#i-scissors\"/><\/svg><span><b>Зависли или сбились?<\/b> Скажите «Гуля, стоп», помолчите секунду и повторите фразу — это место я вырежу сама.<\/span><\/li>\n    <li><svg class=\"ic\"><use href=\"#i-users\"/><\/svg><span>Записывайтесь, пожалуйста, <b>без людей за спиной<\/b> — их я убрать не смогу.<\/span><\/li>\n      <\/ul>\n      <div id=\"bgHome2\"><\/div>\n      <\/div>\n      <aside class=\"live\" id=\"live\" aria-label=\"Как идёт запись\">\n        <div class=\"live-tag\" id=\"liveTag\"><span id=\"liveL\">Идёт запись<\/span> <b id=\"liveT\">00:00<\/b><\/div>\n        <div class=\"live-cam\" id=\"liveCamBox\"><video id=\"liveCam\" autoplay muted playsinline><\/video><canvas class=\"fx\" id=\"fxB\" aria-hidden=\"true\"><\/canvas><span class=\"fxtag\"><svg class=\"ic\"><use href=\"#i-image\"/><\/svg>С фоном<\/span><\/div>\n        <p class=\"live-note\" id=\"liveNote\"><span>Так Вас видно — как в зеркале.<\/span><span class=\"nl\"> Смотрите в камеру, а не на это окно.<\/span><\/p>\n        <div class=\"live-scr\" id=\"liveScrBox\" hidden><span class=\"live-cap\">Записываю этот экран:<\/span><video id=\"liveScr\" autoplay muted playsinline><\/video><\/div>\n        <div class=\"live-voice\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-mic\"/><\/svg><div class=\"live-meter\" title=\"Громкость голоса\"><i id=\"lvl2\"><\/i><\/div><span class=\"live-hear\" id=\"liveHear\" aria-live=\"polite\">Голос записывается<\/span><\/div>\n        <p class=\"live-stop g2o\" hidden><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-scissors\"/><\/svg><span>Зависли — скажите <b>«Гуля, стоп»<\/b> и продолжайте<\/span><\/p>\n        <p class=\"cpq g2o\" id=\"cpQ2\" hidden aria-live=\"polite\"><\/p>\n        <p class=\"live-warn\" id=\"liveWarn\" hidden role=\"alert\"><\/p>\n        <button type=\"button\" class=\"live-fold ui-btn ui-btn--secondary ui-btn--sm\" id=\"liveFold\">Свернуть окно<\/button>\n      <\/aside>\n      <\/div>\n    <\/section>\n  <\/div>\n  <section class=\"card res\" id=\"res\">\n    <h2><span class=\"n\">3<\/span>Мои записи этого урока<\/h2>\n    <p class=\"hint\" id=\"note\">Здесь появится каждая запись: когда сделана, сколько длится и дошла ли до Гули. Новая — сверху.<\/p>\n    <div class=\"rb\" id=\"rb\"><p class=\"rb-next\" id=\"buildNext\" hidden>Следующий шаг<\/p><button type=\"button\" class=\"rb-go\" id=\"buildBtn\" disabled>Отметьте запись<\/button><p class=\"rb-sub\" id=\"buildSub\"><\/p><button type=\"button\" class=\"rb-take\" id=\"takeLink\" hidden><\/button><\/div>\n    <ul id=\"files\"><\/ul>\n    <div class=\"trash\" id=\"trash\"><\/div>\n    <div class=\"trash\" id=\"arch\"><\/div>\n  <\/section>\n  <p class=\"ver\" id=\"ver\">Версия страницы: 26.11.2026 16:19 МСК<\/p>\n<\/div>\n<div class=\"toast ui-toast\" id=\"toast\" role=\"status\"><\/div>\n<div class=\"ui-modal\" id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mdT\"><div class=\"ui-modal__box\">\n  <div class=\"ui-modal__icon\"><svg class=\"ic\"><use href=\"#i-trash\"/><\/svg><\/div>\n  <h3 class=\"ui-modal__title\" id=\"mdT\"><\/h3>\n  <p class=\"ui-modal__text\" id=\"mdX\"><\/p>\n  <div class=\"ui-modal__acts\"><button type=\"button\" class=\"ui-btn ui-btn--secondary\" id=\"mdNo\">Оставить<\/button><button type=\"button\" class=\"ui-btn ui-btn--danger\" id=\"mdYes\"><svg class=\"ic\"><use href=\"#i-trash\"/><\/svg><span>Удалить запись<\/span><\/button><\/div>\n<\/div><\/div>\n<div class=\"ui-modal\" id=\"devModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"devT\"><div class=\"ui-modal__box\">\n  <h3 class=\"ui-modal__title\" id=\"devT\">Микрофон и камера<\/h3>\n  <div id=\"devHome\"><\/div>\n  <div class=\"ui-modal__acts\"><button type=\"button\" class=\"ui-btn ui-btn--primary\" id=\"devNo\">Готово<\/button><\/div>\n<\/div><\/div>\n<div class=\"ui-modal\" id=\"howModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"howT\"><div class=\"ui-modal__box\">\n  <h3 class=\"ui-modal__title\" id=\"howT\">Как записывать<\/h3>\n  <ul class=\"g2how-list\">\n    <li><svg class=\"ic\"><use href=\"#i-bulb\"/><\/svg><span><b>Свет<\/b> — лицом к окну или лампе, не спиной.<\/span><\/li>\n    <li><svg class=\"ic\"><use href=\"#i-mute\"/><\/svg><span><b>Тишина<\/b> — закройте дверь, выключите звук телефона.<\/span><\/li>\n    <li><svg class=\"ic\"><use href=\"#i-timer\"/><\/svg><span><b>Проба 10 секунд<\/b> — «Начать запись», пара фраз, «Закончить запись», послушайте в «Моих записях».<\/span><\/li>\n    <li><svg class=\"ic\"><use href=\"#i-scissors\"/><\/svg><span><b>Зависли или сбились?<\/b> Скажите «Гуля, стоп», помолчите секунду и повторите фразу — это место я вырежу сама.<\/span><\/li>\n    <li><svg class=\"ic\"><use href=\"#i-image\"/><\/svg><span><b>Фон<\/b> — Вы видите себя с выбранным фоном, но в файл идёт оригинал камеры, как есть. Нужный фон я поставлю при монтаже — там его можно сменить.<\/span><\/li>\n    <li><svg class=\"ic\"><use href=\"#i-wifi\"/><\/svg><span><b>Пропала связь<\/b> — запись идёт дальше, записанное сохраняется на этом компьютере. Когда связь вернётся, я догружу их сама.<\/span><\/li>\n    <li><svg class=\"ic\"><use href=\"#i-copy\"/><\/svg><span><b>Одна вкладка<\/b> — записывайте только в одной: если запись уже идёт в другой вкладке, здесь я её не включу.<\/span><\/li>\n    <li><svg class=\"ic\"><use href=\"#i-refresh\"/><\/svg><span><b>Закрыли страницу?<\/b> Запись получит пометку «Прервана» — то, что успело записаться, у меня. Продолжить можно новой записью.<\/span><\/li>\n    <li><svg class=\"ic\"><use href=\"#i-users\"/><\/svg><span>Записывайтесь, пожалуйста, <b>без людей за спиной<\/b> — их я убрать не смогу.<\/span><\/li>\n    <li><svg class=\"ic\"><use href=\"#i-monitor\"/><\/svg><span><b>Показать экран<\/b> — как в Zoom: выберите окно программы или сайта, оно встанет в кадр вместо слайдов.<\/span><\/li>\n  <\/ul>\n  <p class=\"g2keys\">Клавиши: <kbd>←<\/kbd> <kbd>→<\/kbd> слайды · <kbd>P<\/kbd> пауза · <kbd>R<\/kbd> слайд заново · <kbd>X<\/kbd> убрать последнюю фразу · <kbd>U<\/kbd> отменить · <kbd>W<\/kbd> показать экран<\/p>\n  <div class=\"ui-modal__acts\"><button type=\"button\" class=\"ui-btn ui-btn--primary\" id=\"howNo\">Понятно<\/button><\/div>\n<\/div><\/div>\n<div class=\"ui-modal\" id=\"takeModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"takeT\"><div class=\"ui-modal__box\">\n  <h3 class=\"ui-modal__title\" id=\"takeT\">Дубли по слайдам<\/h3>\n  <p class=\"ui-modal__text\">Эти слайды записаны не один раз. Нажмите, какую запись взять для слайда. Пока не выбрали — беру последнюю.<\/p>\n  <div id=\"takeList\" class=\"tk-list\"><\/div>\n  <div class=\"ui-modal__acts\"><button type=\"button\" class=\"ui-btn ui-btn--primary\" id=\"takeNo\">Готово<\/button><\/div>\n<\/div><\/div>\n<svg xmlns=\"http://www.w3.org/2000/svg\" style=\"display:none\" aria-hidden=\"true\"><symbol id=\"i-archive\" viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"5\" rx=\"1\"/><path d=\"M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8

<title>Сметчик-фрилансер</title>
<style>
:root { --paper:#f3f5f4; --ink:#1b2422; --muted:#5b6865; --line:#cdd6d3; --card:#fff; --signal:#d9480f; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --paper:#0f1c2b; --ink:#e6edf3; --muted:#9fb0c0; --line:#2a4058; --card:#132437; --signal:#ff7a3d; color-scheme:dark; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui, sans-serif; padding:16px; box-sizing:border-box; }
form { background:var(--card); border:2px solid var(--ink); padding:1.75rem 1.5rem; width:min(100%, 22rem); display:grid; gap:.8rem; }
h1 { margin:0; font-size:1.8rem; line-height:1.1; } h1 span { color:var(--signal); }
p { margin:0; color:var(--muted); }
input[type=password] { font:inherit; border:1px solid var(--line); padding:.6rem .8rem; background:var(--paper); color:var(--ink); }
button { font:600 1rem system-ui, sans-serif; border:0; padding:.7rem 1rem; background:var(--signal); color:#fff; cursor:pointer; }
label.rem { font-size:.9rem; color:var(--muted); display:flex; gap:.4rem; align-items:center; }
.err { color:var(--signal); min-height:1.2em; font-size:.9rem; }
</style></head><body>

function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('pe-mal-tok-')===0){var d=k.slice(11);if(!d||have[d])continue;if(ME.role!=='founder'&&d.indexOf(String(ME.code||'')+'-')!==0)continue;   /* 24.11: чужие ключи в браузере (другой вход на этом компьютере) — не показываем */have[d]=1;var mm={};try{mm=JSON.parse(localStorage.getItem('pe-mal-meta-'+d)||'{}')||{}}catch(e){}
    var dm=/-(\d\d)(\d\d)(\d\d)(?:-|$)/.exec(d),t=mm.c?Math.round(mm.c/1000):(dm?Math.round(Date.parse('20'+dm[1]+'-'+dm[2]+'-'+dm[3]+'T12:00:00')/1000):0);
    ME.decks.push({deck:d,title:(mm.t||'Презентация от '+(dm?dm[3]+'.'+dm[2]+'.20'+dm[1]:d)).slice(0,140),who:'Малевича',st:'Оформление слайдов',btn:'Открыть',href:'/pe/malevich/#'+d,done:false,t:t,expert:mm.e||'',loc:1})}}}catch(e){}
  ME.decks.sort(function(a,b){return (b.t||0)-(a.t||0)})}
var ARCH={};try{ARCH=JSON.parse(ls('pe-raboty-arch')||'{}')||{}}catch(e){ARCH={}}
function isArch(x){var o=ARCH[x.deck];return o?!!o.on:!!x.arch}
function app(){addLocal();(ME.decks||[]).forEach(function(x){var o=ARCH[x.deck];if(o&&!!o.on===!!x.arch)delete ARCH[x.deck]});try{ls('pe-raboty-arch',JSON.stringify(ARCH))}catch(e){}
  var A=ME.decks||[],W=A.filter(function(x){return !isArch(x)}),na=A.length-W.length,nw=W.filter(function(x){return !x.done}).length,nd=W.length-nw;
  $('#root').innerHTML='<div class="top"><span class="who"><i>≡</i><span>Мои работы</span></span><a class="new" href="/pe/dveri/">+ Новая работа</a><a class="lk" href="/otd/ooo/">⌂ Двери</a></div>'+
    '<main><div class="tabs" role="tablist"><button data-t="all">Все · '+W.length+'</button><button data-t="work">В работе · '+nw+'</button><button data-t="done">Готовые · '+nd+'</button><button data-t="arch">Архив · '+na+'</button></div><div id="list"></div></main>';
  document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){TAB=b.getAttribute('data-t');draw()}});draw()}
function draw(){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===TAB)});
  var W=(ME.decks||[]).filter(function(x){return TAB==='arch'?isArch(x):(!isArch(x)&&(TAB==='all'||(TAB==='done')===!!x.done))});
  $('#list').innerHTML=W.length?W.map(function(x){return '<div class="card"><span class="at'+(x.done?' ok':'')+'">'+(x.done?'':'у ')+'<b>'+esc(x.done&&x.gdone?'Готово':x.who)+'</b></span>'+
    '<span class="ti"><b title="'+esc(x.title)+'">'+esc(x.title)+'</b><small>'+liveSt(x)+(x.t?' · '+dt(x.t):'')+(ME.role==='founder'&&x.expert?'<span class="ex"> · '+esc(x.expert)+'</span>':'')+'</small></span>'+
    '<span class="bt">'+(TAB==='arch'?'<button class="go" type="button" data-arch="'+esc(x.deck)+'" data-on="0">Вернуть из архива</button>':'')+(TAB==='arch'?'':(lv(x)&&lv(x).t0?'<button class="stopb" type="button" data-stop="'+esc(x.deck)+'"'+(lv(x).stopping?' disabled':'')+'>■ '+(lv(x).stopping?'Останавливаю…':'Остановить')+'</button>':'')+(x.sok?'<a class="go w" href="'+esc(x.sok)+'">Тексты — у Сократа</a>':'')+'<a class="go'+(x.done?' w':'')+'" href="'+esc(x.href)+'">'+esc(x.btn)+'</a><button class="arb" type="button" data-arch="'+esc(x.deck)+'" data-on="1">В архив</button>')+'</span></div>'}).join(''):
    '<p class="none">'+(TAB==='done'?'Готовых работ пока нет.':TAB==='arch'?'В архиве пусто.':'Работ пока нет. Начните новую работу — кнопка «+ Новая работа» вверху.')+'</p>'}
/* 19.11 («Двери 2.0», слой 1, п. 2): у работ, где сейчас пишет Сократ, — живой ход и «■ Остановить» */
var LIVE={},LIM={program:150,slides:300,check:330,answer:90,edit:150},WHAT={program:'Сократ пишет программу урока',slides:'Сократ пишет тексты слайдов',check:'Сократ сверяет с источниками',answer:'Сократ отвечает на вопрос',edit:'Сократ вносит правки'};
function lv(x){var v=LIVE[x.deck];return v&&v.t0?v:null}
function liveSt(x){if(x.mt0&&!x.done){var s1=Math.max(0,(Date.now()-x.mt0)/1000),p1=Math.min(96,Math.max(3,Math.round(s1/60/(x.eta||4)*100)));
  return '<span class="live">Монтаж идёт '+p1+' % · работаю '+Math.round(s1)+' с</span><span class="bar"><i style="width:'+p1+'%"></i></span>'}   /* 24.11: живая шкала монтажа, обновление каждые 2 с */
  var v=LIVE[x.deck];if(v&&v.t0){var s=Math.max(0,Date.now()/1000-v.t0),lim=LIM[v.mode]||150,p=Math.min(95,Math.max(3,Math.round(s/lim*100)));
  return '<span class="live">'+esc(WHAT[v.mode]||'Сократ работает')+'… '+p+' %'+(s>lim?' · ещё немного — заканчиваю':'')+'</span><span class="bar"><i style="width:'+p+'%"></i></span>'}
  if(v&&v.stopped)return 'Остановлено — всё сохранено';return esc(x.st)}
var LBUSY=false;
async function livePoll(){if(LBUSY||!ME||(TEST&&!window.__RB_LIVE)||document.hidden)return;LBUSY=true;var ch=false;
  try{var M=(ME.decks||[]).filter(function(x){return !x.done&&!isArch(x)&&x.who==='Малевича'}).slice(0,40);   /* 19.11: «Утверждено N из M» — из базы, а не из снимка при выкладке */
    if(M.length){var r0=await fetch(SB.url.replace(/\/$/,'')+'/rest/v1/pe_state?select=deck,data&key=eq.s25&deck=in.('+M.map(function(x){return encodeURIComponent(x.deck)}).join(',')+')',{headers:{apikey:SB.key,Authorization:'Bearer '+SB.key},cache:'no-store'});
      if(r0.ok){var rows=await r0.json(),by={};rows.forEach(function(q){by[q.deck]=q.data});
        M.forEach(function(x){var sl=(by[x.deck]&&by[x.deck].slides)||[],n=sl.length,ok=sl.filter(function(q){return q.st==='approved'||q.st==='skipped'}).length,st=n?(ok===n?'Все '+n+' слайдов утверждены':'Утверждено '+ok+' из '+n+' слайдов — остальные ждут Вас'):x.st;
          if(st!==x.st){x.st=st;ch=true}})}}}catch(e){}
  try{var W=(ME.decks||[]).filter(function(x){return !x.done&&!isArch(x)&&x.who==='Сократа'});
    for(var i=0;i<W.length;i++){var x=W[i];window.PE={tok:x.tok||''};var r=await G2L.get(x.deck,'sokw',3000),d=r&&r.data,nv=null;
      if(d&&!d.done&&d.t0&&Date.now()/1000-d.t0<1500)nv={mode:d.mode,t0:d.t0,stopping:(LIVE[x.deck]||{}).stopping};else if(d&&d.done&&d.stopped)nv={stopped:true};
      if(JSON.stringify(nv)!==JSON.stringify(LIVE[x.deck]||null)||(nv&&nv.t0))ch=true;LIVE[x.deck]=nv}
  }catch(e){}
  /* 24.11 («Двери 2.0 · Гудвин», п. 11): у работ на этапе записи — этап из задач pe_jobs: записано → проверить текст → монтаж идёт N % → урок готов */
  try{var G=(ME.decks||[]).filter(function(x){return !isArch(x)&&x.who==='Гудвина · оператора'&&!x.gdone}).slice(0,40);
    if(G.length){var r2=await fetch(SB.url.replace(/\/$/,'')+'/rest/v1/pe_jobs?select=id,deck,status,payload,eta_min,started_at,created_at&kind=eq.upload&deck=in.('+G.map(function(x){return encodeURIComponent(x.deck)}).join(',')+')&order=id.desc&limit=300',{headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'x-pe-token':G.map(function(x){return x.tok||''}).filter(Boolean).join(',')},cache:'no-store'});
      if(r2.ok){var jr=await r2.json();
        G.forEach(function(x){var L=null,T=null;jr.forEach(function(j){if(j.deck!==x.deck)return;var a=(j.payload||{}).action;if(!L&&a==='lesson'&&j.status!=='error')L=j;if(!T&&a==='transcribe'&&j.status!=='error')T=j});
          var base='/pe/'+x.deck,u=L&&(!T||L.id>T.id)?L:T;if(!u)return;var st,btn,hr,dn=false;
          if(u===L){if(L.status==='done'){st='Урок готов — можно смотреть';btn='Смотреть';hr=base+'/gotovo/';dn=true}
            else{var s0=Date.parse(L.started_at||L.created_at)||Date.now(),eta=+L.eta_min||4;x.mt0=s0;x.eta=eta;st='Монтаж идёт';btn='Смотреть ход';hr=base+'/montazh/'}}
          else{if(T.status==='done'){var du=+(T.payload||{}).dur||0,mm=Math.floor(du/60),ss=Math.round(du%60);st='Записано'+(du?', '+mm+':'+(ss<10?'0':'')+ss:'')+' — проверьте текст';btn='Проверить текст';hr=base+'/tekst/'}
            else{st='Расшифровываю запись…';btn='Открыть';hr=base+'/tekst/'}}
          if(!(u===L&&L.status!=='done'))x.mt0=0;if(x.st!==st||x.btn!==btn||x.href!==hr||!!x.done!==dn){x.st=st;x.btn=btn;x.href=hr;x.done=dn;if(dn)x.gdone=1;ch=true}})}}}catch(e){}
  LBUSY=false;if(ch){draw();var W2=(ME.decks||[]).filter(function(x){return !isArch(x)}),n2=W2.filter(function(x){return !x.done}).length,bs=document.querySelectorAll('.tabs button');if(bs.length>=3){bs[0].textContent='Все · '+W2.length;bs[1].textContent='В работе · '+n2;bs[2].textContent='Готовые · '+(W2.length-n2)}}}
async function stopCard(deck){var x=(ME.decks||[]).filter(function(y){return y.deck===deck})[0];if(!x)return;var v=LIVE[deck];if(v)v.stopping=true;draw();
  var API=SB.url.replace(/\/$/,''),h={apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json',Prefer:'return=minimal'},vt=ls('sf-voter')||'';if(x.tok)h['x-pe-token']=x.tok;
  try{var r=await fetch(API+'/rest/v1/pe_jobs',{method:'POST',headers:h,body:JSON.stringify(x.tok?{deck:deck,kind:'upload',round:1,status:'queued',author:String(ME.io||'эксперт').slice(0,120),payload:{action:'sokrat_stop'}}:{deck:'start',kind:'upload',round:1,status:'queued',author:String(ME.io||'эксперт').slice(0,120),payload:{action:'sokrat_stop',deck:deck,voter:vt}})});
    if(!r.ok)throw r.status;toast('Останавливаю. Файлы и тексты сохранятся.',3500);setTimeout(livePoll,3000)}
  catch(e){if(v)v.stopping=false;draw();toast('Нет связи — остановить не получилось, попробуйте ещё раз',4000)}}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-stop]');if(b)stopCard(b.getAttribute('data-stop'));
  var a=e.target.closest&&e.target.closest('[data-arch]');if(a)archCard(a.getAttribute('data-arch'),a.getAttribute('data-on')==='1')});
/* 23.11 (Руслан, макет «Архив»): «В архив» / «Вернуть из архива» — без окна; сразу на экране, в базу работы — задачей для Мака (archived в deck.json) */
async function archCard(deck,on){ARCH[deck]={on:on,t:Date.now()};try{ls('pe-raboty-arch',JSON.stringify(ARCH))}catch(e){}
  var A=ME.decks||[],W=A.filter(function(x){return !isArch(x)}),nw=W.filter(function(x){return !x.done}).length;
  var tb=document.querySelectorAll('.tabs button');if(tb.length===4){tb[0].textContent='Все · '+W.length;tb[1].textContent='В работе · '+nw;tb[2].textContent='Готовые · '+(W.length-nw);tb[3].textContent='Архив · '+(A.length-W.length)}
  draw();toast(on?'Работа в архиве — вкладка «Архив»':'Вернула, работа снова в списке',2600);
  if(TEST&&!window.__RB_LIVE)return;
  var h={apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json',Prefer:'return=minimal'};
  try{var r=await fetch(SB.url.replace(/\/$/,'')+'/rest/v1/pe_jobs',{method:'POST',headers:h,body:JSON.stringify({deck:'start',kind:'upload',round:1,status:'queued',author:String(ME.io||'эксперт').slice(0,120),payload:{action:'raboty_archive',deck:deck,on:on}})});if(!r.ok)throw r.status}
  catch(e){toast('Нет связи — архив сохранён только на этом экране, повторите позже',4000)}}
if(TEST)window.__RB={me:function(){return ME},poll:livePoll,draw:draw};   /* только на стенде: для автопроверки */
setInterval(livePoll,6000);setInterval(function(){if(document.hidden||!ME)return;if((ME.decks||[]).some(function(x){return x.mt0&&!x.done&&!isArch(x)})){draw();if(!window.__mtp||Date.now()-window.__mtp>5500){window.__mtp=Date.now();livePoll()}}},2000);setTimeout(livePoll,1200);
boot();
})();

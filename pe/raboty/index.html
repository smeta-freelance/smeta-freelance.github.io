<style>
:root{--ink:#15171C;--muted:#5B6270;--line:#E4E6EB;--bg:#fff;--side:#F8F8F7;--blue:#1745E0;--blue-soft:#EEF2FE;--green:#177245;--red:#C2313D}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Golos Text",system-ui,sans-serif}
button{font:inherit;cursor:pointer}a{color:var(--blue)}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5;white-space:nowrap}
.top .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}.top .who i{font-style:normal;width:30px;height:30px;border-radius:8px;background:var(--side);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px}
.top .new{margin-left:auto;background:var(--blue);color:#fff;border-radius:10px;padding:6px 14px;font-weight:600;font-size:15px;text-decoration:none}
.top .lk{color:var(--ink);text-decoration:none;border:1.5px solid var(--line);border-radius:10px;padding:5px 12px;font-weight:600;font-size:15px}.top .lk:hover{background:var(--side)}
main{max-width:880px;margin:0 auto;padding:18px 22px 60px}
.tabs{display:flex;gap:8px;margin:0 0 14px}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.card{display:grid;grid-template-columns:200px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 10px;background:#fff}
.card .at{font-size:14px;color:var(--muted);white-space:nowrap}.card .at b{color:var(--ink);font-size:15px;font-weight:600}
.card .at.ok b{color:var(--green)}
.card .ti{min-width:0}.card .ti b{display:block;font-size:17px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card .ti small{display:block;color:var(--muted);font-size:14px}
.card .go{background:var(--blue);color:#fff;border-radius:10px;padding:0 16px;height:44px;display:inline-flex;align-items:center;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.card .go.w{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.none{color:var(--muted);margin:24px 0}
.login{max-width:420px;margin:12vh auto;padding:28px;border:1px solid var(--line);border-radius:16px}
.login h1{font-size:22px;margin:10px 0 4px}.login p{color:var(--muted);margin:0 0 16px;font-size:16px}
.login input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;margin-bottom:10px}
.login .go{width:100%;justify-content:center;background:var(--blue);color:#fff;border:0;border-radius:12px;height:52px;font-weight:600}.login .msg{color:var(--red);font-size:15px;min-height:22px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#15171C;color:#fff;border-radius:10px;padding:8px 16px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
.card .ti small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media (max-width:1180px){.card .ex{display:none}}
@media (max-width:760px){.card{grid-template-columns:1fr}.top .who span{display:none}}
</style></head>

    '<input id="lg" autocomplete="username" placeholder="Логин"><input id="pw" type="password" autocomplete="current-password" placeholder="Пароль"><button class="go" type="submit">Войти</button><div class="msg" id="lm"></div></form>';
  $('#lf').onsubmit=async function(e){e.preventDefault();var L=$('#lg').value,P=$('#pw').value,m=$('#lm');m.textContent='';
    var ah=await sha('acc:'+String(L).trim().toLowerCase());if(!ACC[ah])ah=await sha('acc:'+lat(L));
    if(!ACC[ah]){m.textContent='Такого логина нет. Проверьте логин.';return}
    try{var b=await bits(npw(P),ACC[ah].salt);ME=await dec(b,ACC[ah].data)}catch(x){m.textContent='Пароль не подошёл. Проверьте раскладку и попробуйте ещё раз.';return}
    ls('pe-hub-k',b2s(b));ls('pe-hub-acc',ah);ls('pe-hub-who',lat(L));ls('pe-hub-exp',String(Date.now()+30*864e5));app()}}
function dt(t){if(!t)return '';var d=new Date(t*1000);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function app(){var W=ME.decks||[],nw=W.filter(function(x){return !x.done}).length,nd=W.length-nw;
  $('#root').innerHTML='<div class="top"><span class="who"><i>≡</i><span>Мои работы</span></span><a class="new" href="/pe/dveri/">+ Новая работа</a><a class="lk" href="/pe/dveri/">⌂ Двери</a></div>'+
    '<main><div class="tabs" role="tablist"><button data-t="all">Все · '+W.length+'</button><button data-t="work">В работе · '+nw+'</button><button data-t="done">Готовые · '+nd+'</button></div><div id="list"></div></main>';
  document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){TAB=b.getAttribute('data-t');draw()}});draw()}
function draw(){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===TAB)});
  var W=(ME.decks||[]).filter(function(x){return TAB==='all'||(TAB==='done')===!!x.done});
  $('#list').innerHTML=W.length?W.map(function(x){return '<div class="card"><span class="at'+(x.done?' ok':'')+'">'+(x.done?'':'у ')+'<b>'+esc(x.who)+'</b></span>'+
    '<span class="ti"><b title="'+esc(x.title)+'">'+esc(x.title)+'</b><small>'+esc(x.st)+(x.t?' · '+dt(x.t):'')+(ME.role==='founder'&&x.expert?'<span class="ex"> · '+esc(x.expert)+'</span>':'')+'</small></span>'+
    '<a class="go'+(x.done?' w':'')+'" href="'+esc(x.href)+'">'+esc(x.btn)+'</a></div>'}).join(''):
    '<p class="none">'+(TAB==='done'?'Готовых работ пока нет.':'Работ пока нет. Начните новую работу — кнопка «+ Новая работа» вверху.')+'</p>'}
boot();
})();
</script></body></html>

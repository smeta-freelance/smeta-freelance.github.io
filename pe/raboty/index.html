<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Golos Text",system-ui,sans-serif}
button{font:inherit;cursor:pointer}a{color:var(--blue)}

.top .new{min-height:40px;display:inline-flex;align-items:center;margin-left:auto;background:var(--blue);color:#fff;border-radius:10px;padding:6px 14px;font-weight:600;font-size:15px;text-decoration:none}

main{max-width:880px;margin:0 auto;padding:18px 22px 60px}
.tabs{display:flex;gap:8px;margin:0 0 14px}.tabs button{min-height:40px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 16px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.card{display:grid;grid-template-columns:200px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 10px;background:#fff}
.card .at{font-size:14px;color:var(--muted);white-space:nowrap}.card .at b{color:var(--ink);font-size:15px;font-weight:600}
.card .at.ok b{color:var(--green)}
.card .ti{min-width:0}.card .ti b{display:block;font-size:17px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card .ti small{display:block;color:var(--muted);font-size:14px}

.card .go.w{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.card .stopb{background:#fff;color:var(--red);border:1.5px solid var(--red);border-radius:10px;padding:0 16px;height:44px;font-weight:600;font-size:15px;white-space:nowrap}.card .stopb:disabled{opacity:.55}
.card .live{color:var(--blue);font-weight:600}.card .bar{display:block;height:6px;border-radius:99px;background:#E9EBEF;overflow:hidden;margin-top:4px;max-width:260px}.card .bar i{display:block;height:100%;background:var(--blue)}
.none{color:var(--muted);margin:24px 0}
.login{max-width:420px;margin:12vh auto;padding:28px;border:1px solid var(--line);border-radius:16px}
.login h1{font-size:22px;margin:10px 0 4px}.login p{color:var(--muted);margin:0 0 16px;font-size:16px}
.login input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;margin-bottom:10px}
.login .go{width:100%;justify-content:center;background:var(--blue);color:#fff;border:0;border-radius:12px;height:52px;font-weight:600}.login .msg{color:var(--red);font-size:15px;min-height:22px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#15171C;color:#fff;border-radius:10px;padding:8px 16px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
.card .ti small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media (max-width:1180px){.card .ex{display:none}}
@media (max-width:760px){.card{grid-template-columns:1fr}.tabs{flex-wrap:wrap}.card .bt{justify-content:flex-start}}

  var key=await crypto.subtle.importKey('raw',b.slice(0,32),'AES-CBC',false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:b.slice(32,48)},key,ct)))}
function toast(t,ms){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},ms||2600)}
async function boot(){
  var kb=ls('pe-hub-k'),ah=ls('pe-hub-acc'),exp=+ls('pe-hub-exp')||0;
  if(kb&&ah&&ACC[ah]&&exp>Date.now()){try{ME=await dec(b64(kb),ACC[ah].data);return app()}catch(e){}}
  if(kb&&ah&&!ACC[ah]&&exp>Date.now()){location.replace('/pe/');return}
  login()}
function login(){
  $('#root').innerHTML='<form class="login" id="lf"><img src="/pe/sokrat/img/logo.png" alt="Академия Сметного Дела" style="height:34px"><h1>Мои работы</h1><p>Войдите так же, как в кабинет Академии.</p>'+
    '<input id="lg" autocomplete="username" placeholder="Логин"><input id="pw" type="password" autocomplete="current-password" placeholder="Пароль"><button class="go" type="submit">Войти</button><div class="msg" id="lm"></div></form>';
  $('#lf').onsubmit=async function(e){e.preventDefault();var L=$('#lg').value,P=$('#pw').value,m=$('#lm');m.textContent='';
    var ah=await sha('acc:'+String(L).trim().toLowerCase());if(!ACC[ah])ah=await sha('acc:'+lat(L));
    if(!ACC[ah]){m.textContent='Такого логина нет. Проверьте логин.';return}
    try{var b=await bits(npw(P),ACC[ah].salt);ME=await dec(b,ACC[ah].data)}catch(x){m.textContent='Пароль не подошёл. Проверьте раскладку и попробуйте ещё раз.';return}
    ls('pe-hub-k',b2s(b));ls('pe-hub-acc',ah);ls('pe-hub-who',lat(L));ls('pe-hub-exp',String(Date.now()+30*864e5));app()}}
function dt(t){if(!t)return '';var d=new Date(t*1000);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
/* 19.11 (отзыв тестировщицы: «пустой, но я уже создала презентацию»): список «Моих работ» собирается при выкладке и не знает о работах, созданных после неё —
   добавляем работы, переданные Малевичу в этом браузере (отметка pe-mal-tok-<работа>), а статус берём из базы (livePoll) */
function addLocal(){var have={};(ME.decks||[]).forEach(function(x){have[x.deck]=1});ME.decks=ME.decks||[];
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('pe-mal-tok-')===0){var d=k.slice(11);if(!d||have[d])continue;have[d]=1;var mm={};try{mm=JSON.parse(localStorage.getItem('pe-mal-meta-'+d)||'{}')||{}}catch(e){}
    var dm=/-(\d\d)(\d\d)(\d\d)(?:-|$)/.exec(d),t=mm.c?Math.round(mm.c/1000):(dm?Math.round(Date.parse('20'+dm[1]+'-'+dm[2]+'-'+dm[3]+'T12:00:00')/1000):0);
    ME.decks.push({deck:d,title:(mm.t||'Презентация от '+(dm?dm[3]+'.'+dm[2]+'.20'+dm[1]:d)).slice(0,140),who:'Малевича',st:'Оформление слайдов',btn:'Открыть',href:'/pe/malevich/#'+d,done:false,t:t,expert:mm.e||'',loc:1})}}}catch(e){}
  ME.decks.sort(function(a,b){return (b.t||0)-(a.t||0)})}
function app(){addLocal();var W=ME.decks||[],nw=W.filter(function(x){return !x.done}).length,nd=W.length-nw;
  $('#root').innerHTML='<div class="top"><span class="who"><i>≡</i><span>Мои работы</span></span><a class="new" href="/pe/dveri/">+ Новая работа</a><a class="lk" href="/otd/ooo/">⌂ Двери</a></div>'+
    '<main><div class="tabs" role="tablist"><button data-t="all">Все · '+W.length+'</button><button data-t="work">В работе · '+nw+'</button><button data-t="done">Готовые · '+nd+'</button></div><div id="list"></div></main>';
  document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){TAB=b.getAttribute('data-t');draw()}});draw()}
function draw(){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===TAB)});
  var W=(ME.decks||[]).filter(function(x){return TAB==='all'||(TAB==='done')===!!x.done});
  $('#list').innerHTML=W.length?W.map(function(x){return '<div class="card"><span class="at'+(x.done?' ok':'')+'">'+(x.done?'':'у ')+'<b>'+esc(x.who)+'</b></span>'+
    '<span class="ti"><b title="'+esc(x.title)+'">'+esc(x.title)+'</b><small>'+liveSt(x)+(x.t?' · '+dt(x.t):'')+(ME.role==='founder'&&x.expert?'<span class="ex"> · '+esc(x.expert)+'</span>':'')+'</small></span>'+
    '<span class="bt">'+(lv(x)&&lv(x).t0?'<button class="stopb" type="button" data-stop="'+esc(x.deck)+'"'+(lv(x).stopping?' disabled':'')+'>■ '+(lv(x).stopping?'Останавливаю…':'Остановить')+'</button>':'')+(x.sok?'<a class="go w" href="'+esc(x.sok)+'">Тексты — у Сократа</a>':'')+'<a class="go'+(x.done?' w':'')+'" href="'+esc(x.href)+'">'+esc(x.btn)+'</a></span></div>'}).join(''):
    '<p class="none">'+(TAB==='done'?'Готовых работ пока нет.':'Работ пока нет. Начните новую работу — кнопка «+ Новая работа» вверху.')+'</p>'}
/* 19.11 («Двери 2.0», слой 1, п. 2): у работ, где сейчас пишет Сократ, — живой ход и «■ Остановить» */
var LIVE={},LIM={program:150,slides:300,check:330,answer:90,edit:150},WHAT={program:'Сократ пишет программу урока',slides:'Сократ пишет тексты слайдов',check:'Сократ сверяет с источниками',answer:'Сократ отвечает на вопрос',edit:'Сократ вносит правки'};
function lv(x){var v=LIVE[x.deck];return v&&v.t0?v:null}
function liveSt(x){var v=LIVE[x.deck];if(v&&v.t0){var s=Math.max(0,Date.now()/1000-v.t0),lim=LIM[v.mode]||150,p=Math.min(95,Math.max(3,Math.round(s/lim*100)));
  return '<span class="live">'+esc(WHAT[v.mode]||'Сократ работает')+'… '+p+' %'+(s>lim?' · ещё немного — заканчиваю':'')+'</span><span class="bar"><i style="width:'+p+'%"></i></span>'}
  if(v&&v.stopped)return 'Остановлено — всё сохранено';return esc(x.st)}
var LBUSY=false;
async function livePoll(){if(LBUSY||!ME||(TEST&&!window.__RB_LIVE)||document.hidden)return;LBUSY=true;var ch=false;
  try{var M=(ME.decks||[]).filter(function(x){return !x.done&&x.who==='Малевича'}).slice(0,40);   /* 19.11: «Утверждено N из M» — из базы, а не из снимка при выкладке */
    if(M.length){var r0=await fetch(SB.url.replace(/\/$/,'')+'/rest/v1/pe_state?select=deck,data&key=eq.s25&deck=in.('+M.map(function(x){return encodeURIComponent(x.deck)}).join(',')+')',{headers:{apikey:SB.key,Authorization:'Bearer '+SB.key},cache:'no-store'});
      if(r0.ok){var rows=await r0.json(),by={};rows.forEach(function(q){by[q.deck]=q.data});
        M.forEach(function(x){var sl=(by[x.deck]&&by[x.deck].slides)||[],n=sl.length,ok=sl.filter(function(q){return q.st==='approved'||q.st==='skipped'}).length,st=n?(ok===n?'Все '+n+' слайдов утверждены':'Утверждено '+ok+' из '+n+' слайдов — остальные ждут Вас'):x.st;
          if(st!==x.st){x.st=st;ch=true}})}}}catch(e){}
  try{var W=(ME.decks||[]).filter(function(x){return !x.done&&x.who==='Сократа'});
    for(var i=0;i<W.length;i++){var x=W[i];window.PE={tok:x.tok||''};var r=await G2L.get(x.deck,'sokw',3000),d=r&&r.data,nv=null;
      if(d&&!d.done&&d.t0&&Date.now()/1000-d.t0<1500)nv={mode:d.mode,t0:d.t0,stopping:(LIVE[x.deck]||{}).stopping};else if(d&&d.done&&d.stopped)nv={stopped:true};
      if(JSON.stringify(nv)!==JSON.stringify(LIVE[x.deck]||null)||(nv&&nv.t0))ch=true;LIVE[x.deck]=nv}
  }catch(e){}LBUSY=false;if(ch)draw()}
async function stopCard(deck){var x=(ME.decks||[]).filter(function(y){return y.deck===deck})[0];if(!x)return;var v=LIVE[deck];if(v)v.stopping=true;draw();
  var API=SB.url.replace(/\/$/,''),h={apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json',Prefer:'return=minimal'},vt=ls('sf-voter')||'';if(x.tok)h['x-pe-token']=x.tok;
  try{var r=await fetch(API+'/rest/v1/pe_jobs',{method:'POST',headers:h,body:JSON.stringify(x.tok?{deck:deck,kind:'upload',round:1,status:'queued',author:String(ME.io||'эксперт').slice(0,120),payload:{action:'sokrat_stop'}}:{deck:'start',kind:'upload',round:1,status:'queued',author:String(ME.io||'эксперт').slice(0,120),payload:{action:'sokrat_stop',deck:deck,voter:vt}})});
    if(!r.ok)throw r.status;toast('Останавливаю. Файлы и тексты сохранятся.',3500);setTimeout(livePoll,3000)}
  catch(e){if(v)v.stopping=false;draw();toast('Нет связи — остановить не получилось, попробуйте ещё раз',4000)}}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-stop]');if(b)stopCard(b.getAttribute('data-stop'))});
setInterval(livePoll,6000);setTimeout(livePoll,1200);
boot();
})();

<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Golos Text",system-ui,sans-serif}
button{font:inherit;cursor:pointer}a{color:var(--blue)}

.top .new{min-height:40px;display:inline-flex;align-items:center;margin-left:auto;background:var(--blue);color:#fff;border-radius:10px;padding:6px 14px;font-weight:600;font-size:15px;text-decoration:none}

main{max-width:880px;margin:0 auto;padding:18px 22px 60px}
.tabs{display:flex;gap:8px;margin:0 0 14px}.tabs button{min-height:40px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 16px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.card{display:grid;grid-template-columns:200px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 10px;background:#fff}
.card .at{font-size:14px;color:var(--muted);white-space:nowrap}.card .at b{color:var(--ink);font-size:15px;font-weight:600}
.card .at.ok b{color:var(--green)}
.card .ti{min-width:0}.card .ti b{display:block;font-size:17px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card .ti small{display:block;color:var(--muted);font-size:14px}
.card .go{background:var(--blue);color:#fff;border-radius:10px;padding:0 16px;height:44px;display:inline-flex;align-items:center;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}

.card .go.w{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.card .stopb{background:#fff;color:var(--red);border:1.5px solid var(--red);border-radius:10px;padding:0 16px;height:44px;font-weight:600;font-size:15px;white-space:nowrap}.card .stopb:disabled{opacity:.55}
.card .live{color:var(--blue);font-weight:600}.card .bar{display:block;height:6px;border-radius:99px;background:#E9EBEF;overflow:hidden;margin-top:4px;max-width:260px}.card .bar i{display:block;height:100%;background:var(--blue)}
.none{color:var(--muted);margin:24px 0}
.login{max-width:420px;margin:12vh auto;padding:28px;border:1px solid var(--line);border-radius:16px}
.login h1{font-size:22px;margin:10px 0 4px}.login p{color:var(--muted);margin:0 0 16px;font-size:16px}
.login input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;margin-bottom:10px}
.login .go{width:100%;justify-content:center;background:var(--blue);color:#fff;border:0;border-radius:12px;height:52px;font-weight:600}.login .msg{color:var(--red);font-size:15px;min-height:22px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#15171C;color:#fff;border-radius:10px;padding:8px 16px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
.card .ti small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media (max-width:1180px){.card .ex{display:none}}
@media (max-width:760px){.card{grid-template-columns:1fr}.tabs{flex-wrap:wrap}.card .bt{justify-content:flex-start}}
@media (max-width:520px){.top{padding:0 12px;gap:8px}.top .who{font-size:16px}.top .new{padding:6px 10px;font-size:14px}.top .lk{padding:5px 9px;font-size:14px}}

        M.forEach(function(x){var sl=(by[x.deck]&&by[x.deck].slides)||[],n=sl.length,ok=sl.filter(function(q){return q.st==='approved'||q.st==='skipped'}).length,st=n?(ok===n?'Все '+n+' слайдов утверждены':'Утверждено '+ok+' из '+n+' слайдов — остальные ждут Вас'):x.st;
          if(st!==x.st){x.st=st;ch=true}})}}}catch(e){}
  try{var W=(ME.decks||[]).filter(function(x){return !x.done&&x.who==='Сократа'});
    for(var i=0;i<W.length;i++){var x=W[i];window.PE={tok:x.tok||''};var r=await G2L.get(x.deck,'sokw',3000),d=r&&r.data,nv=null;
      if(d&&!d.done&&d.t0&&Date.now()/1000-d.t0<1500)nv={mode:d.mode,t0:d.t0,stopping:(LIVE[x.deck]||{}).stopping};else if(d&&d.done&&d.stopped)nv={stopped:true};
      if(JSON.stringify(nv)!==JSON.stringify(LIVE[x.deck]||null)||(nv&&nv.t0))ch=true;LIVE[x.deck]=nv}
  }catch(e){}LBUSY=false;if(ch)draw()}
async function stopCard(deck){var x=(ME.decks||[]).filter(function(y){return y.deck===deck})[0];if(!x)return;var v=LIVE[deck];if(v)v.stopping=true;draw();
  var API=SB.url.replace(/\/$/,''),h={apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json',Prefer:'return=minimal'},vt=ls('sf-voter')||'';if(x.tok)h['x-pe-token']=x.tok;
  try{var r=await fetch(API+'/rest/v1/pe_jobs',{method:'POST',headers:h,body:JSON.stringify(x.tok?{deck:deck,kind:'upload',round:1,status:'queued',author:String(ME.io||'эксперт').slice(0,120),payload:{action:'sokrat_stop'}}:{deck:'start',kind:'upload',round:1,status:'queued',author:String(ME.io||'эксперт').slice(0,120),payload:{action:'sokrat_stop',deck:deck,voter:vt}})});
    if(!r.ok)throw r.status;toast('Останавливаю. Файлы и тексты сохранятся.',3500);setTimeout(livePoll,3000)}
  catch(e){if(v)v.stopping=false;draw();toast('Нет связи — остановить не получилось, попробуйте ещё раз',4000)}}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-stop]');if(b)stopCard(b.getAttribute('data-stop'))});

boot();

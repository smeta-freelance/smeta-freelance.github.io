if (saved) dec(b64(saved)).then(show).catch(function () { try { localStorage.removeItem("sf-key-" + SALT); } catch (e) {} });
document.getElementById("f").addEventListener("submit", async function (ev) {
  ev.preventDefault();
  var err = document.getElementById("err"); err.textContent = "Проверяю…";
  try {
    var bits = await bitsFrom(document.getElementById("pw").value);
    var page = await dec(bits);
    if (document.getElementById("rem").checked) {
      try { localStorage.setItem("sf-key-" + SALT, btoa(String.fromCharCode.apply(null, bits))); } catch (e) {}
    }
    show(page);
  } catch (e) { err.textContent = "Неверный пароль. Попробуйте ещё раз."; }
});
</script></body></html>

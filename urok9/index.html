<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Сметчик-фрилансер</title>
<style>
:root { --paper:#f3f5f4; --ink:#1b2422; --muted:#5b6865; --line:#cdd6d3; --card:#fff; --signal:#d9480f; color-scheme:light; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:18px/1.5 system-ui, sans-serif; padding:16px; box-sizing:border-box; }
form { background:var(--card); border:2px solid var(--ink); padding:1.75rem 1.5rem; width:min(100%, 22rem); display:grid; gap:.8rem; }
h1 { margin:0; font-size:1.8rem; line-height:1.1; } h1 span { color:var(--signal); }
p { margin:0; color:var(--muted); }
input[type=password], input#pw { font:inherit; font-size:1.2rem; border:2px solid #8a9794; border-radius:8px; padding:.7rem .8rem; background:#fff !important; color:#111 !important; -webkit-text-fill-color:#111; caret-color:#111; }
input::placeholder { color:#6b7774; opacity:1; }
.show { font-size:.95rem; color:var(--muted); display:flex; gap:.4rem; align-items:center; }
button { min-height:48px; font-size:1.1rem !important; }
button { font:600 1rem system-ui, sans-serif; border:0; padding:.7rem 1rem; background:var(--signal); color:#fff; cursor:pointer; }
label.rem { font-size:.9rem; color:var(--muted); display:flex; gap:.4rem; align-items:center; }
.err { color:var(--signal); min-height:1.2em; font-size:.9rem; }
</style></head><body>

<label class="show"><input id="shw" type="checkbox" onchange="document.getElementById('pw').type=this.checked?'text':'password'"> Показать пароль</label>
<label class="rem"><input id="rem" type="checkbox" checked> Запомнить на этом устройстве</label>
<button type="submit">Открыть</button><div class="err" id="err" role="alert"></div></form>

function hex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function bitsFrom(pw) {
  var k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: hex(SALT), iterations: ITER, hash: "SHA-256" }, k, 384));
}
async function dec(bits) {
  var ct = b64(DATA);
  if (String.fromCharCode.apply(null, ct.slice(0, 8)) === "Salted__") ct = ct.slice(16);
  var key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, ct));
}

var saved = null; try { saved = localStorage.getItem("sf-key-" + SALT); } catch (e) {}

document.getElementById("f").addEventListener("submit", async function (ev) {

  var err = document.getElementById("err"); err.textContent = "Проверяю…";

    var page = await dec(bits);
    if (document.getElementById("rem").checked) {

    show(page);
  } catch (e) { err.textContent = "Неверный пароль. Попробуйте ещё раз."; }

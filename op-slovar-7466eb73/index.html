function hex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function sha(s) { var d = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s))); return Array.prototype.map.call(d, function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }
async function bitsFrom(pw, salt) {
  var k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: hex(salt), iterations: ITER, hash: "SHA-256" }, k, 384));
}
async function dec(bits, data) {
  var ct = b64(data);
  if (String.fromCharCode.apply(null, ct.slice(0, 8)) === "Salted__") ct = ct.slice(16);
  var key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, ct));
}
function show(page) {   // сохранённый ключ расшифровывает ещё до конца загрузки — тогда write дописал бы, а не заменил страницу
  var go = function () { document.open(); document.write(page); document.close(); };
  if (document.readyState === "complete") go(); else window.addEventListener("load", go);
}
var saved = null; try { saved = JSON.parse(localStorage.getItem("op-slovar-key") || "null"); } catch (e) {}
if (saved && ACC[saved.h]) dec(b64(saved.k), ACC[saved.h].d).then(show).catch(function () { try { localStorage.removeItem("op-slovar-key"); } catch (e) {} });
document.getElementById("f").addEventListener("submit", async function (ev) {
  ev.preventDefault(); var err = document.getElementById("err"); err.textContent = "Проверяю…";
  try {
    var lg = norm(document.getElementById("lg").value), h = await sha("op-slovar:" + lg), a = ACC[h];
    if (!a) throw new Error("login");
    var bits = await bitsFrom(lg + ":" + norm(document.getElementById("pw").value), a.s), page = await dec(bits, a.d);
    if (document.getElementById("rem").checked) { try { localStorage.setItem("op-slovar-key", JSON.stringify({ h: h, k: btoa(String.fromCharCode.apply(null, bits)) })); } catch (e) {} }
    show(page);
  } catch (e) { err.textContent = "Логин или пароль не подошли. Проверьте и попробуйте ещё раз."; }
});
